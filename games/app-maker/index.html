<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>そうすけの アプリづくり</title>
<link rel="stylesheet" href="../../style.css">
<style>
  body { background: linear-gradient(135deg, #7EC8E3 0%, #C8F7C5 100%); background-attachment: fixed; }

  .stage-wrap {
    position: relative;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .phone-frame {
    width: 240px;
    background: #222;
    border-radius: 30px;
    padding: 14px 10px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 12px 24px rgba(0,0,0,0.3);
  }
  .phone-screen {
    background: #FFF8E7;
    border-radius: 16px;
    min-height: 380px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .app-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px;
    background: rgba(255,255,255,0.5);
  }
  .app-icon { font-size: 1.8rem; }
  .app-name-input {
    flex: 1; min-width: 0;
    font-size: 0.85rem; font-weight: bold;
    border: none; background: transparent; color: #333;
    outline: none;
  }
  .app-canvas {
    flex: 1;
    padding: 10px;
    display: flex; flex-direction: column; gap: 8px;
    overflow-y: auto;
    max-height: 320px;
  }
  .empty-hint-text { font-size: 0.75rem; color: #999; text-align: center; margin-top: 20px; }

  .app-el { border-radius: 10px; padding: 8px 10px; font-size: 0.78rem; }
  .app-btn { background: #4C7BF3; color: #fff; font-weight: bold; text-align: center; border: none; }
  .app-text {
    background: #fff; color: #333; box-shadow: 0 2px 0 rgba(0,0,0,0.08);
    outline: none; cursor: text; min-height: 1.2em;
  }
  .app-text:empty::before { content: attr(data-placeholder); color: #aaa; }
  .app-text:focus { box-shadow: 0 0 0 2px #4C7BF3, 0 2px 0 rgba(0,0,0,0.08); }
  .app-image { background: #fff; font-size: 1.8rem; text-align: center; box-shadow: 0 2px 0 rgba(0,0,0,0.08); cursor: pointer; user-select: none; }
  .app-image.flash { animation: photoFlash 0.35s ease-out; }
  @keyframes photoFlash {
    0% { box-shadow: 0 0 0 0 rgba(255,255,255,0), 0 2px 0 rgba(0,0,0,0.08); }
    30% { box-shadow: 0 0 0 8px rgba(255,255,255,0.9), 0 2px 0 rgba(0,0,0,0.08); }
    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0), 0 2px 0 rgba(0,0,0,0.08); }
  }
  .app-rating { background: #fff; text-align: center; box-shadow: 0 2px 0 rgba(0,0,0,0.08); cursor: pointer; user-select: none; }
  .app-rating .star.off { opacity: 0.25; }
  .app-notif { background: #FFF3CD; color: #7a5c00; box-shadow: 0 2px 0 rgba(0,0,0,0.08); cursor: pointer; user-select: none; }
  .app-notif.poof { animation: notifPoof 0.3s ease-out; }
  @keyframes notifPoof {
    0% { transform: scale(1); }
    40% { transform: scale(0.9) rotate(-2deg); }
    100% { transform: scale(1); }
  }
  .app-music { cursor: pointer; user-select: none; }
  .app-music.playing { animation: musicPulse 0.6s ease-in-out infinite; }
  @keyframes musicPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.4); }
  }
  .app-search { cursor: pointer; user-select: none; }
  .app-graph { background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,0.08); cursor: pointer; user-select: none; }
  .graph-title { display: flex; justify-content: space-between; align-items: center; }
  .graph-diff { font-weight: bold; }
  .graph-bars { display: flex; align-items: flex-end; gap: 4px; height: 40px; margin-top: 4px; }
  .graph-bars span { flex: 1; border-radius: 3px 3px 0 0; transition: height 0.2s ease, background 0.2s ease; }
  .app-music { background: #333; color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,0.08); }
  .app-search { background: #eee; color: #666; box-shadow: 0 2px 0 rgba(0,0,0,0.08); }

  .tool-panel {
    width: 100%;
    background: rgba(255,255,255,0.85);
    border-radius: 16px;
    padding: 14px;
    box-sizing: border-box;
  }
  .tool-title { font-size: 0.85rem; font-weight: bold; color: #333; margin-bottom: 8px; text-align: center; }
  .tool-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .tool-btn {
    border: none; border-radius: 12px;
    padding: 10px 4px;
    background: #FFF6D8;
    color: #333;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-weight: bold;
    font-size: 0.55rem;
  }
  .tool-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  .tool-btn .toemoji { font-size: 1.3rem; }
  .tool-btn.utility { background: #FFD6D6; }

  .done-btn {
    font-size: 1.1rem; font-weight: bold; padding: 14px 32px;
    border: none; border-radius: 999px;
    background: #FF5D8F; color: #fff; cursor: pointer;
    box-shadow: 0 5px 0 #c73f6a;
  }
  .done-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c73f6a; }

  .celebrate-msg {
    font-size: 1rem; font-weight: bold; color: #4CAF50; min-height: 24px; text-align: center;
  }
</style>
</head>
<body class="game-body">
  <a class="home-link" href="../../index.html">🏠 ホームにもどる</a>
  <button class="mute-btn" id="muteBtn">🔊</button>
  <h1 class="game-title">📱 そうすけの アプリづくり</h1>

  <div class="stage-wrap">
    <div class="phone-frame">
      <div class="phone-screen" id="phoneScreen">
        <div class="app-header" id="appHeader">
          <span class="app-icon" id="appIcon">📱</span>
          <input class="app-name-input" id="appNameInput" value="そうすけアプリ" maxlength="14">
        </div>
        <div class="app-canvas" id="appCanvas">
          <div class="empty-hint-text" id="emptyHint">したの どうぐで アプリを つくろう！</div>
        </div>
      </div>
    </div>

    <div class="celebrate-msg" id="celebrateMsg">&nbsp;</div>

    <div class="tool-panel">
      <div class="tool-title">🧰 どうぐばこ</div>
      <div class="tool-grid" id="toolGrid"></div>
    </div>

    <button class="done-btn" id="doneBtn">✅ アプリを つくる！</button>
  </div>

  <script src="../../audio.js?v=13"></script>
  <script>
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.addEventListener('click', () => {
      const isMuted = GameAudio.toggleMute();
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    const ICONS = ['📱', '🎮', '🎨', '🎵', '🏀', '⚽', '🐶', '🐱', '🚀', '⭐', '🍕', '🌈'];
    const BG_COLORS = [
      'linear-gradient(180deg, #FFE9B0 0%, #FFB88C 60%, #FF8A65 100%)',
      'linear-gradient(180deg, #AEE1FF 0%, #E0F7FA 100%)',
      'linear-gradient(180deg, #C8F5D0 0%, #6FCF8F 100%)',
      'linear-gradient(180deg, #0B1B3A 0%, #1B3A6B 60%, #3F5C9E 100%)',
      'linear-gradient(180deg, #FFDDE1 0%, #FCE4EC 100%)',
      'linear-gradient(180deg, #FFF3E0 0%, #FFE0B2 100%)',
    ];
    const IMAGE_EMOJIS = ['🖼️', '📷', '🌄', '🐾', '🌟'];
    const TEXT_SAMPLES = ['テキストです', 'いらっしゃいませ！', 'せつめい ぶんしょう', 'よろしくね！'];

    const appCanvasEl = document.getElementById('appCanvas');
    const emptyHintEl = document.getElementById('emptyHint');
    const appIconEl = document.getElementById('appIcon');
    const appNameInput = document.getElementById('appNameInput');
    const phoneScreenEl = document.getElementById('phoneScreen');
    const toolGridEl = document.getElementById('toolGrid');
    const doneBtn = document.getElementById('doneBtn');
    const celebrateMsgEl = document.getElementById('celebrateMsg');

    let elements = [];
    let iconIndex = 0;
    let bgIndex = 0;

    function refreshEmptyHint() {
      emptyHintEl.style.display = elements.length === 0 ? 'block' : 'none';
    }

    function addElement(html) {
      const wrap = document.createElement('div');
      wrap.innerHTML = html;
      const el = wrap.firstElementChild;
      appCanvasEl.appendChild(el);
      elements.push(el);
      refreshEmptyHint();
      appCanvasEl.scrollTop = appCanvasEl.scrollHeight;
      GameAudio.playClickTick();
      return el;
    }

    const DIFFICULTIES = [
      { label: '🟢 かんたん', color: '#6FCF97' },
      { label: '🟡 ふつう', color: '#FFD93D' },
      { label: '🔴 むずかしい', color: '#FF6B6B' },
    ];

    function rollBars(diff) {
      return Array.from({ length: 4 }, () => {
        const base = diff === 0 ? 15 : diff === 1 ? 25 : 38;
        return Math.round(base + Math.random() * 12);
      });
    }

    function makeGraphElement() {
      const el = addElement('<div class="app-el app-graph"><div class="graph-title"><span>📊 グラフ</span><span class="graph-diff"></span></div><div class="graph-bars"><span></span><span></span><span></span><span></span></div></div>');
      el.dataset.diff = '0';
      function render() {
        const d = Number(el.dataset.diff);
        const info = DIFFICULTIES[d];
        el.querySelector('.graph-diff').textContent = info.label;
        const bars = rollBars(d);
        const barEls = el.querySelectorAll('.graph-bars span');
        bars.forEach((h, i) => {
          barEls[i].style.height = h + 'px';
          barEls[i].style.background = info.color;
        });
      }
      render();
      el.addEventListener('click', () => {
        el.dataset.diff = (Number(el.dataset.diff) + 1) % DIFFICULTIES.length;
        render();
        GameAudio.playClickTick();
      });
    }

    function makeImageElement() {
      const el = addElement(`<div class="app-el app-image">${IMAGE_EMOJIS[Math.floor(Math.random() * IMAGE_EMOJIS.length)]}</div>`);
      el.addEventListener('click', () => {
        el.classList.remove('flash');
        void el.offsetWidth;
        el.classList.add('flash');
        el.textContent = IMAGE_EMOJIS[Math.floor(Math.random() * IMAGE_EMOJIS.length)];
        GameAudio.playClickTick();
      });
    }

    function makeRatingElement() {
      const el = addElement('<div class="app-el app-rating"></div>');
      el.dataset.stars = '5';
      function render() {
        const n = Number(el.dataset.stars);
        el.innerHTML = Array.from({ length: 5 }, (_, i) => `<span class="star${i < n ? '' : ' off'}">⭐</span>`).join('');
      }
      render();
      el.addEventListener('click', () => {
        el.dataset.stars = (Number(el.dataset.stars) % 5) + 1;
        render();
        GameAudio.playClickTick();
      });
    }

    const NOTIF_MESSAGES = [
      '🔔 あたらしい メッセージが あります',
      '🔔 いいねが つきました！',
      '🔔 アップデートが あります',
      '🔔 リマインダー：わすれものは ない？',
    ];
    function makeNotifElement() {
      const el = addElement(`<div class="app-el app-notif">${NOTIF_MESSAGES[0]}</div>`);
      el.dataset.idx = '0';
      el.addEventListener('click', () => {
        el.dataset.idx = (Number(el.dataset.idx) + 1) % NOTIF_MESSAGES.length;
        el.textContent = NOTIF_MESSAGES[el.dataset.idx];
        el.classList.remove('poof');
        void el.offsetWidth;
        el.classList.add('poof');
        GameAudio.playClickTick();
      });
    }

    function makeMusicElement() {
      const el = addElement('<div class="app-el app-music">🎵 タップして さいせい</div>');
      el.dataset.playing = '0';
      el.addEventListener('click', () => {
        const playing = el.dataset.playing === '1';
        if (playing) {
          el.dataset.playing = '0';
          el.textContent = '🎵 タップして さいせい';
          el.classList.remove('playing');
          GameAudio.stopBGM();
        } else {
          el.dataset.playing = '1';
          el.textContent = '⏸️ さいせい ちゅう…';
          el.classList.add('playing');
          GameAudio.playBGM();
        }
      });
    }

    function makeSearchElement() {
      const el = addElement('<div class="app-el app-search">🔍 タップして けんさく</div>');
      el.addEventListener('click', () => {
        el.textContent = '🔍 けんさく ちゅう…';
        GameAudio.playClickTick();
        setTimeout(() => {
          el.textContent = '✅ みつかりました！';
          setTimeout(() => { el.textContent = '🔍 タップして けんさく'; }, 900);
        }, 500);
      });
    }

    function makeTextElement() {
      const el = addElement(`<div class="app-el app-text" contenteditable="true" data-placeholder="タップして かいてね"></div>`);
      el.textContent = TEXT_SAMPLES[Math.floor(Math.random() * TEXT_SAMPLES.length)];
      el.addEventListener('focus', () => {
        GameAudio.playClickTick();
      }, { once: false });
    }

    const TOOLS = [
      { id: 'button', name: 'ボタン', emoji: '🔲', action: () => addElement('<button class="app-el app-btn">ボタン</button>') },
      { id: 'text', name: 'テキスト', emoji: '📝', action: () => makeTextElement() },
      { id: 'image', name: 'がぞう', emoji: '🖼️', action: () => makeImageElement() },
      { id: 'rating', name: 'ひょうか', emoji: '⭐', action: () => makeRatingElement() },
      { id: 'notif', name: 'つうち', emoji: '🔔', action: () => makeNotifElement() },
      { id: 'graph', name: 'グラフ', emoji: '📊', action: () => makeGraphElement() },
      { id: 'music', name: 'おんがく', emoji: '🎵', action: () => makeMusicElement() },
      { id: 'search', name: 'けんさく', emoji: '🔍', action: () => makeSearchElement() },
      { id: 'icon', name: 'アイコン', emoji: '🖌️', action: () => {
        iconIndex = (iconIndex + 1) % ICONS.length;
        appIconEl.textContent = ICONS[iconIndex];
        GameAudio.playClickTick();
      }},
      { id: 'bg', name: 'はいけい', emoji: '🎨', action: () => {
        bgIndex = (bgIndex + 1) % BG_COLORS.length;
        phoneScreenEl.style.background = BG_COLORS[bgIndex];
        GameAudio.playClickTick();
      }},
      { id: 'undo', name: 'ひとつ けす', emoji: '🗑️', utility: true, action: () => {
        const last = elements.pop();
        if (last) last.remove();
        refreshEmptyHint();
        GameAudio.playClickTick();
      }},
      { id: 'clear', name: 'ぜんぶ けす', emoji: '🔄', utility: true, action: () => {
        elements.forEach(el => el.remove());
        elements = [];
        refreshEmptyHint();
        GameAudio.playClickTick();
      }},
    ];

    function renderTools() {
      toolGridEl.innerHTML = '';
      TOOLS.forEach(tool => {
        const btn = document.createElement('button');
        btn.className = 'tool-btn' + (tool.utility ? ' utility' : '');
        btn.innerHTML = `<span class="toemoji">${tool.emoji}</span><span>${tool.name}</span>`;
        btn.addEventListener('click', tool.action);
        toolGridEl.appendChild(btn);
      });
    }

    doneBtn.addEventListener('click', () => {
      GameAudio.playClearFanfare();
      celebrateMsgEl.textContent = `🎉 「${appNameInput.value}」が できあがったよ！すごい！`;
    });

    refreshEmptyHint();
    renderTools();
  </script>
</body>
</html>
