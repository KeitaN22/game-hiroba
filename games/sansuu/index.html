<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>そうすけの たしざん ひきざん</title>
<link rel="stylesheet" href="../../style.css">
<style>
  body { background: linear-gradient(135deg, #FFE985 0%, #6FCF97 100%); background-attachment: fixed; }

  .stage-wrap {
    position: relative;
    width: 100%;
    max-width: 420px;
  }

  .arena {
    position: relative;
    width: 100%;
    min-height: 420px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 12px 24px rgba(0,0,0,0.2);
    padding: 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }

  .hud {
    display: flex; flex-wrap: wrap; gap: 16px; font-size: 1.1rem; font-weight: bold;
    background: rgba(255,255,255,0.85); border-radius: 16px; padding: 8px 18px;
    margin-bottom: 14px;
  }
  .hud.urgent span.time { color: #FF3B3B; }

  .problem-box {
    font-size: 3rem;
    font-weight: bold;
    color: #333;
    background: #FFF6D8;
    border-radius: 20px;
    padding: 18px 32px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    letter-spacing: 4px;
  }
  .problem-box.shake { animation: shake 0.3s ease; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .choice-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    width: 100%;
    max-width: 300px;
  }
  .choice-btn {
    font-size: 1.8rem;
    font-weight: bold;
    padding: 18px 0;
    border: none;
    border-radius: 16px;
    background: #4C7BF3;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 0 #2f56c9;
  }
  .choice-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2f56c9; }
  .choice-btn.correct { background: #4CAF50; box-shadow: 0 5px 0 #357a38; }
  .choice-btn.wrong { background: #FF3B3B; box-shadow: 0 5px 0 #b32323; }

  .feedback-msg { font-size: 1rem; font-weight: bold; min-height: 24px; }
  .feedback-msg.ok { color: #4CAF50; }
  .feedback-msg.ng { color: #FF3B3B; }

  .overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.65);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: #fff; text-align: center; z-index: 10; padding: 20px;
    overflow-y: auto;
  }
  .overlay.hide { display: none !important; }
  .hide { display: none !important; }
  .overlay h2 { font-size: 1.7rem; margin: 6px 0; }
  .overlay p { font-size: 1rem; margin: 6px 0 14px; line-height: 1.6; }
</style>
</head>
<body class="game-body">
  <a class="home-link" href="../../index.html">🏠 ホームにもどる</a>
  <button class="mute-btn" id="muteBtn">🔊</button>
  <h1 class="game-title">➕➖ そうすけの たしざん ひきざん</h1>

  <div class="hud" id="hud">
    <span>せいかい 🎯 <span id="correctCount">0</span></span>
    <span class="time">のこり ⏱️ <span id="timeLeft">60</span> びょう</span>
  </div>

  <div class="stage-wrap">
    <div class="arena">
      <div class="hide" id="quizView" style="display:flex; flex-direction:column; align-items:center; gap:22px;">
        <div class="problem-box" id="problemBox">?</div>
        <div class="choice-grid" id="choiceGrid"></div>
        <div class="feedback-msg" id="feedbackMsg">&nbsp;</div>
      </div>

      <div class="overlay" id="startOverlay">
        <h2>➕➖ たしざん ひきざん</h2>
        <p>
          でてくる もんだいの こたえを、4つの なかから えらんでね。<br>
          60びょうで、なんもん とけるかな？
        </p>
        <button class="big-btn" id="startBtn">▶ スタート</button>
      </div>

      <div class="overlay hide" id="endOverlay">
        <h2 id="endTitle">🎉 おわり！ 🎉</h2>
        <p id="endText"></p>
        <button class="big-btn" id="retryBtn">🔄 もういちど</button>
      </div>
    </div>
  </div>

  <script src="../../audio.js?v=5"></script>
  <script src="../../leaderboard.js?v=2"></script>
  <script>
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.addEventListener('click', () => {
      const isMuted = GameAudio.toggleMute();
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    const GAME_TIME = 60;

    const hudEl = document.getElementById('hud');
    const timeLeftEl = document.getElementById('timeLeft');
    const correctCountEl = document.getElementById('correctCount');
    const quizView = document.getElementById('quizView');
    const problemBox = document.getElementById('problemBox');
    const choiceGridEl = document.getElementById('choiceGrid');
    const feedbackMsgEl = document.getElementById('feedbackMsg');
    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');
    const endTitleEl = document.getElementById('endTitle');
    const endTextEl = document.getElementById('endText');

    let correctCount = 0;
    let timeLeft = GAME_TIME;
    let playing = false;
    let answered = false;
    let countdownTimer = null;
    let currentAnswer = 0;

    function makeProblem() {
      const isAdd = Math.random() < 0.5;
      let a, b, answer, symbol;
      if (isAdd) {
        a = 1 + Math.floor(Math.random() * 9);
        b = 1 + Math.floor(Math.random() * 9);
        answer = a + b;
        symbol = '+';
      } else {
        a = 1 + Math.floor(Math.random() * 9);
        b = 1 + Math.floor(Math.random() * a);
        answer = a - b;
        symbol = '-';
      }
      return { a, b, symbol, answer };
    }

    function makeChoices(answer) {
      const set = new Set([answer]);
      while (set.size < 4) {
        const delta = Math.floor(Math.random() * 7) - 3;
        const candidate = answer + delta;
        if (candidate >= 0 && candidate <= 18 && !set.has(candidate)) set.add(candidate);
      }
      const arr = Array.from(set);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function nextProblem() {
      const p = makeProblem();
      currentAnswer = p.answer;
      problemBox.textContent = `${p.a} ${p.symbol} ${p.b} = ?`;
      problemBox.classList.remove('shake');
      feedbackMsgEl.textContent = ' ';
      feedbackMsgEl.className = 'feedback-msg';
      answered = false;

      const choices = makeChoices(p.answer);
      choiceGridEl.innerHTML = '';
      choices.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = val;
        btn.addEventListener('click', () => onChoice(btn, val));
        choiceGridEl.appendChild(btn);
      });
    }

    function onChoice(btn, val) {
      if (!playing || answered) return;
      if (val === currentAnswer) {
        answered = true;
        btn.classList.add('correct');
        correctCount++;
        correctCountEl.textContent = correctCount;
        GameAudio.playClickTick();
        feedbackMsgEl.textContent = 'せいかい！';
        feedbackMsgEl.classList.add('ok');
        setTimeout(() => { if (playing) nextProblem(); }, 500);
      } else {
        btn.classList.add('wrong');
        problemBox.classList.add('shake');
        GameAudio.playFailBuzz();
        feedbackMsgEl.textContent = 'ちがうよ、もういちど！';
        feedbackMsgEl.classList.add('ng');
        setTimeout(() => btn.classList.remove('wrong'), 300);
      }
    }

    function resetGame() {
      correctCount = 0;
      timeLeft = GAME_TIME;
      correctCountEl.textContent = 0;
      timeLeftEl.textContent = timeLeft;
      hudEl.classList.remove('urgent');
    }

    function startGame() {
      resetGame();
      startOverlay.classList.add('hide');
      endOverlay.classList.add('hide');
      quizView.classList.remove('hide');
      playing = true;
      GameAudio.playBGM();
      nextProblem();

      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        if (!playing) return;
        timeLeft--;
        timeLeftEl.textContent = timeLeft;
        if (timeLeft <= 10) hudEl.classList.add('urgent');
        if (timeLeft <= 0) {
          timeLeftEl.textContent = 0;
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      playing = false;
      clearInterval(countdownTimer);
      quizView.classList.add('hide');
      GameAudio.stopBGM();
      GameAudio.playClearFanfare();
      endTitleEl.textContent = correctCount >= 15 ? '🏆 すごい！ 🏆' : '🎉 おわり！ 🎉';
      endTextEl.textContent = `${correctCount}もん せいかい できたね！`;
      endOverlay.classList.remove('hide');
      Leaderboard.showRankFlow({ gameId: 'sansuu', score: correctCount, higherIsBetter: true, unit: 'もん', title: '➕➖ せいかい すう ランキング' });
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);
  </script>
</body>
</html>
