<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>そうすけの くもたいじ</title>
<link rel="stylesheet" href="../../style.css">
<style>
  body { background: linear-gradient(135deg, #C8F7C5 0%, #FFE985 100%); background-attachment: fixed; }

  .stage-wrap {
    position: relative;
    width: 100%;
    max-width: 440px;
  }

  .hud {
    display: flex; flex-wrap: wrap; gap: 16px; font-size: 1rem; font-weight: bold;
    background: rgba(255,255,255,0.85); border-radius: 16px; padding: 8px 18px;
    margin-bottom: 14px;
  }
  .hud.urgent span.time { color: #FF3B3B; }

  .arena {
    position: relative;
    width: 100%;
    height: 340px;
    border-radius: 20px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 12px 24px rgba(0,0,0,0.2);
    overflow: hidden;
    background: repeating-linear-gradient(0deg, #F5EFE0 0 40px, #EDE4CC 40px 42px);
  }

  .window {
    position: absolute; right: 6%; top: 8%;
    font-size: 2.6rem;
  }
  .window-label {
    position: absolute; right: 4%; top: 3%;
    font-size: 0.55rem; font-weight: bold; color: #556;
    background: rgba(255,255,255,0.7); padding: 2px 8px; border-radius: 999px;
  }

  .spider {
    position: absolute;
    font-size: 2.6rem;
    transform: translate(-50%, -50%);
    transition: opacity 0.3s ease;
    cursor: default;
  }
  @keyframes exitWindow {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx, 100px)), calc(-50% + var(--dy, -60px))) scale(0.3); opacity: 0; }
  }
  @keyframes exitSquish {
    0% { transform: translate(-50%, -50%) scale(1, 1); opacity: 1; }
    50% { transform: translate(-50%, -50%) scale(1.5, 0.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.5, 0.1); opacity: 0; }
  }
  @keyframes exitBroom {
    0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translate(-220px, -50%) rotate(200deg) scale(0.4); opacity: 0; }
  }
  @keyframes exitVacuum {
    0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, calc(-50% + 90px)) scale(0.05) rotate(900deg); opacity: 0; }
  }
  @keyframes exitCup {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    60% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
  }
  @keyframes exitDoor {
    0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translate(180px, 110px) rotate(-160deg) scale(0.3); opacity: 0; }
  }
  .spider.exit-window { animation: exitWindow 0.6s ease-in forwards; }
  .spider.exit-squish { animation: exitSquish 0.4s ease-out forwards; }
  .spider.exit-broom { animation: exitBroom 0.5s ease-in forwards; }
  .spider.exit-vacuum { animation: exitVacuum 0.5s ease-in forwards; }
  .spider.exit-cup { animation: exitCup 0.45s ease-in forwards; }
  .spider.exit-door { animation: exitDoor 0.55s ease-in forwards; }

  .method-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    margin-top: 16px;
  }
  .method-btn {
    font-size: 0.72rem; font-weight: bold; padding: 12px 4px; border: none; border-radius: 14px;
    color: #333; cursor: pointer; user-select: none;
    background: #FFF6D8;
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .method-btn .memoji { font-size: 1.7rem; }
  .method-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .method-btn:disabled { opacity: 0.5; cursor: default; }

  .overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.65);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: #fff; text-align: center; z-index: 10; padding: 20px;
    overflow-y: auto;
  }
  .overlay.hide { display: none !important; }
  .overlay h2 { font-size: 1.7rem; margin: 6px 0; }
  .overlay p { font-size: 0.95rem; margin: 6px 0 14px; line-height: 1.6; }
</style>
</head>
<body class="game-body">
  <a class="home-link" href="../../index.html">🏠 ホームにもどる</a>
  <button class="mute-btn" id="muteBtn">🔊</button>
  <h1 class="game-title">🕷️ そうすけの くもたいじ</h1>

  <div class="hud" id="hud">
    <span>たいおうした 🕷️ <span id="totalCount">0</span></span>
    <span class="time">のこり ⏱️ <span id="timeLeft">40</span> びょう</span>
  </div>

  <div class="stage-wrap">
    <div class="arena" id="arena">
      <span class="window-label">🪟 そと</span>
      <span class="window">🪟</span>
      <span class="spider hide" id="spider">🕷️</span>

      <div class="overlay" id="startOverlay">
        <h2>🕷️ くもたいじ</h2>
        <p>
          かべに くもが でてきたら、6つの ほうほうから えらんで たいおうしよう！<br>
          40びょうで なんびき たいおう できるかな？
        </p>
        <button class="big-btn" id="startBtn">▶ スタート</button>
      </div>

      <div class="overlay hide" id="endOverlay">
        <h2>🎉 おわり！ 🎉</h2>
        <p id="endText"></p>
        <button class="big-btn" id="retryBtn">🔄 もういちど</button>
      </div>
    </div>

    <div class="method-grid" id="methodGrid"></div>
  </div>

  <script src="../../audio.js?v=12"></script>
  <script src="../../leaderboard.js?v=2"></script>
  <script>
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.addEventListener('click', () => {
      const isMuted = GameAudio.toggleMute();
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    const GAME_TIME = 40;
    const SPIDER_MIN_DELAY = 500;
    const SPIDER_MAX_DELAY = 1100;
    const WINDOW_POS = { x: 88, y: 14 };

    const METHODS = [
      { id: 'window', name: 'まどから にがす', emoji: '🪟', anim: 'exit-window', sound: () => GameAudio.playWrapSquish() },
      { id: 'squish', name: 'くつで たいじ', emoji: '👟', anim: 'exit-squish', sound: () => GameAudio.playBugSquish() },
      { id: 'broom', name: 'ほうきで はきだす', emoji: '🧹', anim: 'exit-broom', sound: () => GameAudio.playSweep() },
      { id: 'vacuum', name: 'そうじきで すいこむ', emoji: '🌪️', anim: 'exit-vacuum', sound: () => GameAudio.playVacuum() },
      { id: 'cup', name: 'コップで つかまえる', emoji: '🥤', anim: 'exit-cup', sound: () => GameAudio.playBubbleWrapPop() },
      { id: 'door', name: 'ドアから おいだす', emoji: '🚪', anim: 'exit-door', sound: () => GameAudio.playFruitDrop() },
    ];

    const arenaEl = document.getElementById('arena');
    const spiderEl = document.getElementById('spider');
    const hudEl = document.getElementById('hud');
    const totalCountEl = document.getElementById('totalCount');
    const timeLeftEl = document.getElementById('timeLeft');
    const methodGridEl = document.getElementById('methodGrid');
    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');
    const endTextEl = document.getElementById('endText');

    let counts = {};
    let totalCount = 0;
    let timeLeft = GAME_TIME;
    let playing = false;
    let spiderActive = false;
    let countdownTimer = null;
    let spawnTimer = null;
    let methodBtns = [];

    function renderMethods() {
      methodGridEl.innerHTML = '';
      methodBtns = [];
      METHODS.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'method-btn';
        btn.disabled = true;
        btn.innerHTML = `<span class="memoji">${m.emoji}</span><span>${m.name}</span>`;
        btn.addEventListener('click', () => resolveSpider(m));
        methodGridEl.appendChild(btn);
        methodBtns.push(btn);
      });
    }

    function setMethodsDisabled(disabled) {
      methodBtns.forEach(b => { b.disabled = disabled; });
    }

    function resetGame() {
      counts = {};
      METHODS.forEach(m => { counts[m.id] = 0; });
      totalCount = 0;
      timeLeft = GAME_TIME;
      totalCountEl.textContent = 0;
      timeLeftEl.textContent = timeLeft;
      hudEl.classList.remove('urgent');
      spiderActive = false;
      spiderEl.classList.add('hide');
      spiderEl.classList.remove(...METHODS.map(m => m.anim));
      setMethodsDisabled(true);
    }

    function spawnSpider() {
      if (!playing) return;
      const x = 10 + Math.random() * 70;
      const y = 20 + Math.random() * 65;
      spiderEl.style.left = x + '%';
      spiderEl.style.top = y + '%';
      spiderEl.classList.remove('hide', ...METHODS.map(m => m.anim));
      spiderActive = true;
      setMethodsDisabled(false);
    }

    function scheduleSpawn() {
      clearTimeout(spawnTimer);
      const delay = SPIDER_MIN_DELAY + Math.random() * (SPIDER_MAX_DELAY - SPIDER_MIN_DELAY);
      spawnTimer = setTimeout(spawnSpider, delay);
    }

    function resolveSpider(method) {
      if (!playing || !spiderActive) return;
      spiderActive = false;
      setMethodsDisabled(true);

      if (method.id === 'window') {
        const rect = arenaEl.getBoundingClientRect();
        const spiderRect = spiderEl.getBoundingClientRect();
        const targetX = rect.width * WINDOW_POS.x / 100;
        const targetY = rect.height * WINDOW_POS.y / 100;
        const curX = spiderRect.left - rect.left + spiderRect.width / 2;
        const curY = spiderRect.top - rect.top + spiderRect.height / 2;
        spiderEl.style.setProperty('--dx', (targetX - curX) + 'px');
        spiderEl.style.setProperty('--dy', (targetY - curY) + 'px');
      }

      spiderEl.classList.add(method.anim);
      method.sound();
      counts[method.id]++;
      totalCount++;
      totalCountEl.textContent = totalCount;

      setTimeout(() => {
        spiderEl.classList.add('hide');
        spiderEl.classList.remove(method.anim);
        if (playing) scheduleSpawn();
      }, 500);
    }

    function startGame() {
      resetGame();
      startOverlay.classList.add('hide');
      endOverlay.classList.add('hide');
      playing = true;
      GameAudio.playBGM();
      scheduleSpawn();

      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        if (!playing) return;
        timeLeft--;
        timeLeftEl.textContent = timeLeft;
        if (timeLeft <= 10) hudEl.classList.add('urgent');
        if (timeLeft <= 0) {
          timeLeftEl.textContent = 0;
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      playing = false;
      clearInterval(countdownTimer);
      clearTimeout(spawnTimer);
      spiderActive = false;
      setMethodsDisabled(true);
      GameAudio.stopBGM();
      GameAudio.playClearFanfare();
      const breakdown = METHODS.map(m => `${m.emoji}${counts[m.id]}`).join('　');
      endTextEl.textContent = `ぜんぶで ${totalCount}ひき たいおうしたね！\n${breakdown}`;
      endOverlay.classList.remove('hide');
      Leaderboard.showRankFlow({ gameId: 'spider-patrol', score: totalCount, higherIsBetter: true, unit: 'ひき', title: '🕷️ たいおうした かず ランキング' });
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);

    renderMethods();
  </script>
</body>
</html>
