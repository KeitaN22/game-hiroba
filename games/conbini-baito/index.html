<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>そうすけの コンビニバイト</title>
<link rel="stylesheet" href="../../style.css">
<style>
  body { background: linear-gradient(135deg, #7EC8E3 0%, #6EE7F9 100%); background-attachment: fixed; }

  .stage-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
  }

  .hud {
    display: flex; flex-wrap: wrap; gap: 16px; font-size: 1.05rem; font-weight: bold;
    background: rgba(255,255,255,0.85); border-radius: 16px; padding: 8px 18px;
    margin-bottom: 14px;
  }
  .hud.urgent span.time { color: #FF3B3B; }

  .arena {
    position: relative;
    width: 100%;
    height: 460px;
    border-radius: 20px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 12px 24px rgba(0,0,0,0.2);
    overflow: hidden;
    background: linear-gradient(#F5F5F5 0 22%, #EDEDED 22% 100%);
  }

  .store-sign {
    position: absolute; top: 2%; left: 50%; transform: translateX(-50%);
    font-size: 0.7rem; font-weight: bold; color: #333;
    background: #FFD93D; padding: 3px 16px; border-radius: 999px;
    z-index: 5;
  }

  .shelf-bg {
    position: absolute; left: 4%; right: 4%; top: 8%; height: 12%;
    background: #D8C9A8;
    border-radius: 10px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15);
  }
  .shelf-slot {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: 1.5rem;
    transition: opacity 0.25s ease;
  }
  .shelf-slot.empty { opacity: 0.15; }

  .box-spot {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .box-spot .x-emoji { font-size: 2.2rem; background: rgba(255,255,255,0.6); border-radius: 12px; padding: 4px 8px; transition: box-shadow 0.15s ease; }
  .box-spot.near .x-emoji { box-shadow: 0 0 0 4px #FFD166; }
  .box-spot .x-label { font-size: 0.55rem; font-weight: bold; color: #444; background: rgba(255,255,255,0.85); border-radius: 8px; padding: 1px 5px; }

  .toilet-spot {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: pointer;
  }
  .toilet-spot .t-emoji {
    font-size: 2.2rem;
    background: rgba(255,255,255,0.7);
    border-radius: 12px;
    padding: 4px 8px;
  }
  .toilet-spot .t-label { font-size: 0.55rem; font-weight: bold; color: #444; background: rgba(255,255,255,0.85); border-radius: 8px; padding: 1px 5px; }

  .door-label {
    position: absolute; left: 3%; top: 46%;
    font-size: 0.55rem; font-weight: bold; color: #444;
    background: rgba(255,255,255,0.8); padding: 2px 6px; border-radius: 8px;
  }

  .counter {
    position: absolute; left: 10%; right: 10%; top: 68%; height: 12%;
    background: #C9A063;
    border-radius: 10px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
  }
  .register-machine {
    position: absolute;
    left: 50%; top: 68%;
    transform: translate(-50%, -70%);
    display: flex; flex-direction: column; align-items: center;
    z-index: 2;
  }
  .register-machine .r-emoji {
    font-size: 1.8rem;
    background: #444;
    border-radius: 8px;
    padding: 3px 8px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.3);
  }
  .register-machine .r-label {
    font-size: 0.5rem; font-weight: bold; color: #444;
    background: rgba(255,255,255,0.85); padding: 1px 6px; border-radius: 8px;
    margin-top: 2px;
  }

  .clerk {
    position: absolute;
    font-size: 2.4rem;
    transform: translate(-50%, -50%);
    z-index: 6;
  }

  .customer {
    position: absolute;
    font-size: 2.4rem;
    transform: translate(-50%, -50%);
    transition: left 0.8s ease-in-out, top 0.8s ease-in-out, opacity 0.4s ease;
  }
  .customer.hide { display: none; }
  .customer-item {
    position: absolute;
    font-size: 1.1rem;
    transform: translate(-50%, -180%);
  }

  .money-icon {
    position: absolute;
    font-size: 1.3rem;
    transition: left 0.4s ease-in, top 0.4s ease-in, opacity 0.3s ease;
  }
  .money-icon.hide { display: none; }

  .angry-bubble {
    position: absolute;
    font-size: 0.75rem;
    font-weight: bold;
    color: #fff;
    background: #FF3B3B;
    padding: 4px 10px;
    border-radius: 999px;
    transform: translate(-50%, -260%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .angry-bubble.show { opacity: 1; animation: angryShake 0.4s ease-in-out infinite; }
  @keyframes angryShake { 0%,100% { transform: translate(-50%, -260%) rotate(-3deg); } 50% { transform: translate(-50%, -260%) rotate(3deg); } }

  .reaction-msg {
    position: absolute;
    left: 50%; top: 42%;
    transform: translate(-50%, -50%) scale(0.6);
    background: rgba(255,255,255,0.95);
    color: #333;
    font-size: 0.85rem;
    font-weight: bold;
    padding: 8px 16px;
    border-radius: 999px;
    opacity: 0;
    z-index: 8;
    white-space: nowrap;
    pointer-events: none;
  }
  .reaction-msg.show { animation: reactPop 1.1s ease-out forwards; }
  @keyframes reactPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -65%) scale(1); }
  }

  .toilet-msg {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    background: rgba(79,195,247,0.95);
    color: #fff;
    font-size: 0.8rem;
    font-weight: bold;
    padding: 8px 16px;
    border-radius: 999px;
    opacity: 0;
    z-index: 9;
    white-space: nowrap;
    pointer-events: none;
  }
  .toilet-msg.show { animation: reactPop 1.4s ease-out forwards; }

  .controls-row {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 16px;
    margin-top: 16px;
  }
  .dpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
  }
  .dpad-btn {
    font-size: 1.3rem;
    border: none; border-radius: 12px;
    background: #fff;
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    cursor: pointer; user-select: none; touch-action: none;
  }
  .dpad-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .dpad-btn.empty { visibility: hidden; }

  .action-col { display: flex; flex-direction: column; gap: 10px; }
  .action-btn {
    font-size: 0.9rem; font-weight: bold; padding: 12px 18px; border: none; border-radius: 14px;
    color: #fff; cursor: pointer; user-select: none;
  }
  .register-btn { background: #4CAF50; box-shadow: 0 5px 0 #357a38; }
  .phone-btn { background: #FF6B6B; box-shadow: 0 5px 0 #b33a3a; }
  .restock-btn { background: #999; box-shadow: 0 5px 0 #666; }
  .restock-btn.ready { background: #FF9A56; box-shadow: 0 5px 0 #c96e2e; }
  .clover-btn { background: #6FCF97; box-shadow: 0 5px 0 #4a9e6b; }
  .clover-btn.held { background: #4CAF50; box-shadow: 0 5px 0 #357a38; }
  .fight-btn { background: #9B59B6; box-shadow: 0 5px 0 #6d3d82; }
  .action-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .action-btn:disabled { opacity: 0.5; cursor: default; }

  .overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.65);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: #fff; text-align: center; z-index: 10; padding: 20px;
    overflow-y: auto;
  }
  .overlay.hide { display: none !important; }
  .overlay h2 { font-size: 1.7rem; margin: 6px 0; }
  .overlay p { font-size: 1rem; margin: 6px 0 14px; line-height: 1.6; }
</style>
</head>
<body class="game-body">
  <a class="home-link" href="../../index.html">🏠 ホームにもどる</a>
  <button class="mute-btn" id="muteBtn">🔊</button>
  <h1 class="game-title">🏪 そうすけの コンビニバイト</h1>

  <div class="hud" id="hud">
    <span>スコア 💰 <span id="scoreEl">0</span></span>
    <span class="time">のこり ⏱️ <span id="timeLeft">60</span> びょう</span>
  </div>

  <div class="stage-wrap">
    <div class="arena" id="arena">
      <span class="store-sign">🏪 24じかん コンビニ</span>
      <div class="shelf-bg"></div>
      <div id="shelfLayer"></div>
      <span class="door-label">🚪 いりぐち</span>
      <div class="counter"></div>
      <div class="register-machine">
        <span class="r-emoji">🖥️</span>
        <span class="r-label">💰 レジ</span>
      </div>

      <div class="box-spot" id="boxSpot">
        <span class="x-emoji">📦</span>
        <span class="x-label">しなもの ばこ</span>
      </div>

      <span class="clerk" id="clerk">🧑‍💼</span>
      <span class="customer hide" id="customer">🧑</span>
      <span class="customer-item hide" id="customerItem"></span>
      <span class="money-icon hide" id="moneyIcon">💴</span>
      <span class="angry-bubble" id="angryBubble">💢 はやく しろ！</span>
      <span class="reaction-msg" id="reactionMsg"></span>
      <span class="toilet-msg" id="toiletMsg">🚻 きゅうけいちゅう…</span>

      <div class="toilet-spot" id="toiletSpot">
        <span class="t-emoji">🚻</span>
        <span class="t-label">トイレ</span>
      </div>

      <div class="overlay" id="startOverlay">
        <h2>🏪 コンビニバイト</h2>
        <p>
          やじるしで うごいて、レジの ちかくで おきゃくさんに たいおうしよう。<br>
          ふつうの ひとには「💰 レジをする」、あやしい 🥷わるものには「📞 でんわする」！<br>
          しなものが なくなったら、しなものばこの ちかくで「🔄 ほじゅう」を おそう。
        </p>
        <button class="big-btn" id="startBtn">▶ スタート</button>
      </div>

      <div class="overlay hide" id="endOverlay">
        <h2>🎉 おつかれさま！ 🎉</h2>
        <p id="endText"></p>
        <button class="big-btn" id="retryBtn">🔄 もういちど</button>
      </div>
    </div>
  </div>

  <div class="controls-row">
    <div class="dpad-grid">
      <button class="dpad-btn empty"></button>
      <button class="dpad-btn" id="btnUp">⬆️</button>
      <button class="dpad-btn empty"></button>
      <button class="dpad-btn" id="btnLeft">⬅️</button>
      <button class="dpad-btn empty"></button>
      <button class="dpad-btn" id="btnRight">➡️</button>
      <button class="dpad-btn empty"></button>
      <button class="dpad-btn" id="btnDown">⬇️</button>
      <button class="dpad-btn empty"></button>
    </div>
    <div class="action-col">
      <button class="action-btn register-btn" id="registerBtn" disabled>💰 レジをする</button>
      <button class="action-btn phone-btn" id="phoneBtn" disabled>📞 でんわする</button>
      <button class="action-btn restock-btn" id="restockBtn" disabled>🔄 ほじゅう</button>
      <button class="action-btn clover-btn" id="cloverBtn">🍀 クローバーを もつ</button>
      <button class="action-btn fight-btn" id="fightBtn" disabled>🍀 たたかう</button>
    </div>
  </div>

  <script src="../../audio.js?v=12"></script>
  <script src="../../leaderboard.js?v=2"></script>
  <script>
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.addEventListener('click', () => {
      const isMuted = GameAudio.toggleMute();
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    const PRODUCT_EMOJIS = ['🍫', '🍪', '🥤', '🍙', '🥪', '📖', '🧃', '🍩'];
    const NORMAL_CUSTOMERS = ['🧑', '👩', '👦', '👧', '👴', '👵', '🧒', '👨'];
    const BAD_CUSTOMER = '🥷';
    const BAD_CHANCE = 0.28;
    const GAME_TIME = 60;
    const DOOR_POS = { x: 6, y: 55 };
    const COUNTER_STAND_POS = { x: 50, y: 78 };
    const TOILET_POS = { x: 90, y: 88 };
    const BOX_POS = { x: 68, y: 88 };
    const REGISTER_POS = { x: 50, y: 68 };
    const PLAYER_HOME = { x: 50, y: 78 };
    const PROXIMITY = 55;
    const CUSTOMER_GAP_MS = 700;

    const arenaEl = document.getElementById('arena');
    const hudEl = document.getElementById('hud');
    const scoreEl = document.getElementById('scoreEl');
    const timeLeftEl = document.getElementById('timeLeft');
    const shelfLayerEl = document.getElementById('shelfLayer');
    const boxSpotEl = document.getElementById('boxSpot');
    const clerkEl = document.getElementById('clerk');
    const customerEl = document.getElementById('customer');
    const customerItemEl = document.getElementById('customerItem');
    const moneyIconEl = document.getElementById('moneyIcon');
    const angryBubbleEl = document.getElementById('angryBubble');
    const reactionMsgEl = document.getElementById('reactionMsg');
    const toiletMsgEl = document.getElementById('toiletMsg');
    const toiletSpotEl = document.getElementById('toiletSpot');
    const registerBtn = document.getElementById('registerBtn');
    const phoneBtn = document.getElementById('phoneBtn');
    const restockBtn = document.getElementById('restockBtn');
    const cloverBtn = document.getElementById('cloverBtn');
    const fightBtn = document.getElementById('fightBtn');
    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');
    const endTextEl = document.getElementById('endText');

    let score = 0;
    let timeLeft = GAME_TIME;
    let playing = false;
    let countdownTimer = null;
    let spawnTimer = null;
    let currentCustomer = null; // { isBad, emoji, slotIndex }
    let awaitingAction = false;
    let customerBusy = false;

    let shelf = [];
    let shelfEls = [];
    let clerkX = 0, clerkY = 0;
    let input = { up: false, down: false, left: false, right: false };
    let nearCounter = false;
    let nearBox = false;
    let holdingClover = false;
    let lastFrame = 0;

    function pxOf(pctX, pctY) {
      return { x: arenaEl.clientWidth * pctX / 100, y: arenaEl.clientHeight * pctY / 100 };
    }

    function slotPos(i) {
      return { x: 10 + i * (80 / (PRODUCT_EMOJIS.length - 1)), y: 14 };
    }

    function buildShelf() {
      shelfLayerEl.innerHTML = '';
      shelf = PRODUCT_EMOJIS.map(emoji => ({ emoji, stocked: true }));
      shelfEls = shelf.map((item, i) => {
        const el = document.createElement('span');
        el.className = 'shelf-slot';
        el.textContent = item.emoji;
        const p = slotPos(i);
        el.style.left = p.x + '%';
        el.style.top = p.y + '%';
        shelfLayerEl.appendChild(el);
        return el;
      });
    }

    function renderShelf() {
      shelf.forEach((item, i) => {
        shelfEls[i].classList.toggle('empty', !item.stocked);
      });
    }

    function stockedSlotIndexes() {
      const arr = [];
      shelf.forEach((s, i) => { if (s.stocked) arr.push(i); });
      return arr;
    }

    function showReaction(text) {
      reactionMsgEl.textContent = text;
      reactionMsgEl.classList.remove('show');
      void reactionMsgEl.offsetWidth;
      reactionMsgEl.classList.add('show');
    }

    function resetGame() {
      score = 0;
      timeLeft = GAME_TIME;
      scoreEl.textContent = 0;
      timeLeftEl.textContent = timeLeft;
      hudEl.classList.remove('urgent');
      currentCustomer = null;
      awaitingAction = false;
      customerBusy = false;
      customerEl.classList.add('hide');
      customerItemEl.classList.add('hide');
      moneyIconEl.classList.add('hide');
      angryBubbleEl.classList.remove('show');
      registerBtn.disabled = true;
      phoneBtn.disabled = true;
      restockBtn.disabled = true;
      fightBtn.disabled = true;
      holdingClover = false;
      cloverBtn.classList.remove('held');
      cloverBtn.textContent = '🍀 クローバーを もつ';
      buildShelf();
      renderShelf();
      boxSpotEl.style.left = BOX_POS.x + '%';
      boxSpotEl.style.top = BOX_POS.y + '%';
      toiletSpotEl.style.left = TOILET_POS.x + '%';
      toiletSpotEl.style.top = TOILET_POS.y + '%';
      const home = pxOf(PLAYER_HOME.x, PLAYER_HOME.y);
      clerkX = home.x; clerkY = home.y;
      clerkEl.style.left = clerkX + 'px';
      clerkEl.style.top = clerkY + 'px';
    }

    function updateProximity() {
      const cp = pxOf(COUNTER_STAND_POS.x, COUNTER_STAND_POS.y);
      nearCounter = Math.hypot(clerkX - cp.x, clerkY - cp.y) < PROXIMITY;
      const bp = pxOf(BOX_POS.x, BOX_POS.y);
      nearBox = Math.hypot(clerkX - bp.x, clerkY - bp.y) < PROXIMITY;
      boxSpotEl.classList.toggle('near', nearBox);
      restockBtn.disabled = !nearBox;
      restockBtn.classList.toggle('ready', nearBox);
      registerBtn.disabled = !(awaitingAction && nearCounter);
      phoneBtn.disabled = !(awaitingAction && nearCounter);
      fightBtn.disabled = !(awaitingAction && nearCounter && holdingClover && currentCustomer && currentCustomer.isBad);
    }

    function pickUpClover() {
      if (!playing || holdingClover) return;
      holdingClover = true;
      cloverBtn.classList.add('held');
      cloverBtn.textContent = '🍀 もっている';
      GameAudio.playClickTick();
      updateProximity();
    }

    function update(dt) {
      if (!playing) return;
      const speed = 150;
      let dx = 0, dy = 0;
      if (input.up) dy -= 1;
      if (input.down) dy += 1;
      if (input.left) dx -= 1;
      if (input.right) dx += 1;
      if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
      clerkX = Math.max(14, Math.min(arenaEl.clientWidth - 14, clerkX + dx * speed * dt));
      clerkY = Math.max(14, Math.min(arenaEl.clientHeight - 14, clerkY + dy * speed * dt));
      clerkEl.style.left = clerkX + 'px';
      clerkEl.style.top = clerkY + 'px';
      updateProximity();
    }

    function loop(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      update(dt);
      requestAnimationFrame(loop);
    }

    function setDir(dir, value) { input[dir] = value; }
    ['Up', 'Down', 'Left', 'Right'].forEach(dir => {
      const key = dir.toLowerCase();
      const btn = document.getElementById('btn' + dir);
      btn.addEventListener('pointerdown', () => setDir(key, true));
      btn.addEventListener('pointerup', () => setDir(key, false));
      btn.addEventListener('pointerleave', () => setDir(key, false));
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') input.up = true;
      if (e.key === 'ArrowDown') input.down = true;
      if (e.key === 'ArrowLeft') input.left = true;
      if (e.key === 'ArrowRight') input.right = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp') input.up = false;
      if (e.key === 'ArrowDown') input.down = false;
      if (e.key === 'ArrowLeft') input.left = false;
      if (e.key === 'ArrowRight') input.right = false;
    });

    function spawnCustomer() {
      if (!playing || customerBusy) return;
      customerBusy = true;
      const isBad = Math.random() < BAD_CHANCE;
      const emoji = isBad ? BAD_CUSTOMER : NORMAL_CUSTOMERS[Math.floor(Math.random() * NORMAL_CUSTOMERS.length)];
      const stocked = stockedSlotIndexes();
      const slotIndex = stocked.length > 0 ? stocked[Math.floor(Math.random() * stocked.length)] : null;
      currentCustomer = { isBad, emoji, slotIndex };

      customerEl.textContent = emoji;
      customerEl.classList.remove('hide');
      customerEl.style.transition = 'none';
      customerEl.style.left = pxOf(DOOR_POS.x, DOOR_POS.y).x + 'px';
      customerEl.style.top = pxOf(DOOR_POS.x, DOOR_POS.y).y + 'px';
      customerEl.style.left = DOOR_POS.x + '%';
      customerEl.style.top = DOOR_POS.y + '%';
      customerEl.style.opacity = '1';
      void customerEl.offsetWidth;
      customerEl.style.transition = '';

      GameAudio.playClickTick();

      if (slotIndex !== null) {
        const sp = slotPos(slotIndex);
        customerEl.style.left = sp.x + '%';
        customerEl.style.top = (sp.y + 8) + '%';
        setTimeout(() => {
          if (!playing) return;
          shelf[slotIndex].stocked = false;
          renderShelf();
          customerItemEl.textContent = PRODUCT_EMOJIS[slotIndex];
          customerItemEl.classList.remove('hide');
          customerItemEl.style.left = sp.x + '%';
          customerItemEl.style.top = (sp.y + 8) + '%';
          GameAudio.playClickTick();
          setTimeout(() => walkToCounter(), 500);
        }, 850);
      } else {
        walkToCounter();
      }
    }

    function walkToCounter() {
      if (!playing) return;
      customerEl.style.left = COUNTER_STAND_POS.x + '%';
      customerEl.style.top = (COUNTER_STAND_POS.y - 16) + '%';
      customerItemEl.style.left = COUNTER_STAND_POS.x + '%';
      customerItemEl.style.top = (COUNTER_STAND_POS.y - 16) + '%';
      setTimeout(() => {
        if (!playing || !currentCustomer) return;
        awaitingAction = true;
        updateProximity();
        if (currentCustomer.isBad) {
          angryBubbleEl.style.left = COUNTER_STAND_POS.x + '%';
          angryBubbleEl.style.top = (COUNTER_STAND_POS.y - 16) + '%';
          angryBubbleEl.classList.add('show');
        } else {
          moneyIconEl.style.transition = 'none';
          moneyIconEl.style.left = (COUNTER_STAND_POS.x + 6) + '%';
          moneyIconEl.style.top = (COUNTER_STAND_POS.y - 20) + '%';
          moneyIconEl.style.opacity = '1';
          moneyIconEl.classList.remove('hide');
          void moneyIconEl.offsetWidth;
          moneyIconEl.style.transition = '';
        }
      }, 850);
    }

    function resolveCustomer(action) {
      if (!playing || !awaitingAction || !currentCustomer || !nearCounter) return;
      awaitingAction = false;
      registerBtn.disabled = true;
      phoneBtn.disabled = true;
      fightBtn.disabled = true;
      angryBubbleEl.classList.remove('show');

      const correct = ((action === 'phone' || action === 'fight') && currentCustomer.isBad) || (action === 'register' && !currentCustomer.isBad);
      if (correct) {
        if (currentCustomer.isBad) {
          score += 15;
          if (action === 'fight') {
            showReaction('🍀 クローバーで やっつけた！ わるものを げきたい！');
          } else {
            showReaction('🚓 つうほう せいこう！ わるものを たいほ！');
          }
          GameAudio.playClearFanfare();
        } else {
          score += 10;
          moneyIconEl.style.left = REGISTER_POS.x + '%';
          moneyIconEl.style.top = REGISTER_POS.y + '%';
          moneyIconEl.style.opacity = '0';
          GameAudio.playClickTick();
          setTimeout(() => showReaction('💰 レジに おかねを いれたよ！ありがとうございました！'), 250);
        }
      } else {
        if (currentCustomer.isBad) {
          score = Math.max(0, score - 10);
          showReaction('😱 あ！にげられちゃった！');
          GameAudio.playFailBuzz();
        } else {
          score = Math.max(0, score - 5);
          showReaction('😳 ぼくは わるいひとじゃないよ！');
          GameAudio.playFailBuzz();
        }
      }
      scoreEl.textContent = score;

      customerEl.style.opacity = '0';
      customerItemEl.style.opacity = '0';
      setTimeout(() => {
        customerEl.classList.add('hide');
        customerItemEl.classList.add('hide');
        customerItemEl.style.opacity = '1';
        moneyIconEl.classList.add('hide');
        moneyIconEl.style.opacity = '1';
        currentCustomer = null;
        customerBusy = false;
        if (playing) {
          clearTimeout(spawnTimer);
          spawnTimer = setTimeout(spawnCustomer, CUSTOMER_GAP_MS);
        }
      }, 400);
    }

    function doRestock() {
      if (!playing || !nearBox) return;
      shelf.forEach(s => { s.stocked = true; });
      renderShelf();
      GameAudio.playClearFanfare();
      showReaction('🔄 しなものを ほじゅうしたよ！');
    }

    registerBtn.addEventListener('click', () => resolveCustomer('register'));
    phoneBtn.addEventListener('click', () => resolveCustomer('phone'));
    restockBtn.addEventListener('click', doRestock);
    cloverBtn.addEventListener('click', pickUpClover);
    fightBtn.addEventListener('click', () => resolveCustomer('fight'));

    toiletSpotEl.addEventListener('click', () => {
      if (!playing) return;
      toiletMsgEl.classList.remove('show');
      void toiletMsgEl.offsetWidth;
      toiletMsgEl.classList.add('show');
      GameAudio.playClickTick();
    });

    function startGame() {
      resetGame();
      startOverlay.classList.add('hide');
      endOverlay.classList.add('hide');
      playing = true;
      GameAudio.playBGM();

      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        if (!playing) return;
        timeLeft--;
        timeLeftEl.textContent = timeLeft;
        if (timeLeft <= 10) hudEl.classList.add('urgent');
        if (timeLeft <= 0) {
          timeLeftEl.textContent = 0;
          endGame();
        }
      }, 1000);

      clearTimeout(spawnTimer);
      spawnTimer = setTimeout(spawnCustomer, 500);
      lastFrame = performance.now();
    }

    function endGame() {
      playing = false;
      clearInterval(countdownTimer);
      clearTimeout(spawnTimer);
      awaitingAction = false;
      registerBtn.disabled = true;
      phoneBtn.disabled = true;
      fightBtn.disabled = true;
      angryBubbleEl.classList.remove('show');
      GameAudio.stopBGM();
      GameAudio.playClearFanfare();
      endTextEl.textContent = `スコア ${score}てんで バイト しゅうりょう！ おつかれさま！`;
      endOverlay.classList.remove('hide');
      Leaderboard.showRankFlow({ gameId: 'conbini-baito', score, higherIsBetter: true, unit: 'てん', title: '🏪 コンビニバイト ランキング' });
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);

    buildShelf();
    renderShelf();
    boxSpotEl.style.left = BOX_POS.x + '%';
    boxSpotEl.style.top = BOX_POS.y + '%';
    toiletSpotEl.style.left = TOILET_POS.x + '%';
    toiletSpotEl.style.top = TOILET_POS.y + '%';
    const home = pxOf(PLAYER_HOME.x, PLAYER_HOME.y);
    clerkX = home.x; clerkY = home.y;
    clerkEl.style.left = clerkX + 'px';
    clerkEl.style.top = clerkY + 'px';
    lastFrame = performance.now();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
