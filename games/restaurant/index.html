<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>そうすけの レストランタイミング</title>
<link rel="stylesheet" href="../../style.css">
<style>
  body { background: linear-gradient(135deg, #FFE985 0%, #FFC1E3 100%); background-attachment: fixed; }

  .stage-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
  }

  .hud {
    display: flex; flex-wrap: wrap; gap: 16px; font-size: 1.1rem; font-weight: bold;
    background: rgba(255,255,255,0.85); border-radius: 16px; padding: 8px 18px;
    margin-bottom: 14px;
  }
  .hud.urgent span.time { color: #FF3B3B; }

  .arena {
    position: relative;
    width: 100%;
    height: 480px;
    border-radius: 20px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 12px 24px rgba(0,0,0,0.2);
    overflow: hidden;
    background:
      linear-gradient(#EAD9B8 0 22%, transparent 22%),
      repeating-linear-gradient(90deg, #E8C68A 0 38px, #DDB876 38px 40px);
    background-color: #EAC68A;
  }

  /* きっちん ゾーン（うえの おびの ぶぶん） */
  .kitchen-zone {
    position: absolute; left: 0; right: 0; top: 0; height: 22%;
    background: linear-gradient(180deg, #D8DEE4 0%, #C3CBD3 100%);
    border-bottom: 4px solid #9AA5AF;
    display: flex; align-items: flex-end; justify-content: space-around;
    padding-bottom: 6px;
    box-sizing: border-box;
  }
  .kitchen-label {
    position: absolute; top: 4px; left: 10px;
    font-size: 0.62rem; font-weight: bold; color: #556;
    background: rgba(255,255,255,0.7); padding: 2px 8px; border-radius: 999px;
  }
  .kitchen-appliance { text-align: center; }
  .kitchen-appliance .appl-emoji {
    font-size: 1.6rem; display: block;
    background: #fff; border-radius: 10px; padding: 4px 8px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }
  .chef-figure { text-align: center; }
  .chef-figure .chef-emoji { font-size: 2.1rem; display: block; animation: chefBob 1.6s ease-in-out infinite; }
  @keyframes chefBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  /* ドア */
  .door {
    position: absolute; left: 0; top: 32%; width: 22px; height: 60px;
    background: #8B5E3C; border-radius: 0 6px 6px 0;
    box-shadow: inset -3px 0 0 #6B4526;
    display: flex; align-items: center; justify-content: flex-end;
  }
  .door::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: #FFD166; margin-right: 3px; }
  .door-label { position: absolute; left: 2px; top: 32%; transform: translateY(-16px); font-size: 0.55rem; font-weight: bold; color: #6B4526; }

  /* おてあらい／シンク ゾーン */
  .sink-zone {
    position: absolute; right: 2%; bottom: 3%; width: 68px; height: 74px;
    background: #DCEBEF; border: 3px solid #B7D2D8; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    cursor: default;
  }
  .sink-zone .sink-basin { font-size: 1.8rem; }
  .sink-zone .sink-label { font-size: 0.55rem; font-weight: bold; color: #556; }

  /* テーブル + いす */
  .table-unit {
    position: absolute;
    width: 78px;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
    cursor: default;
  }
  .table-unit.tappable { cursor: pointer; }
  .chair-graphic {
    width: 34px; height: 14px; background: #C9A063; border-radius: 6px;
    margin-bottom: -6px; box-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }
  .table-graphic {
    width: 70px; height: 70px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #E7C89A, #C9975B);
    border: 4px solid #A97C4F;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    position: relative;
    transition: box-shadow 0.15s ease;
  }
  .table-unit.tappable .table-graphic { box-shadow: 0 4px 0 rgba(0,0,0,0.2), 0 0 0 4px #FFD166; }
  .table-unit.active .table-graphic { box-shadow: 0 4px 0 rgba(0,0,0,0.2), 0 0 0 4px #4C7BF3; }
  .seat-num {
    position: absolute; top: -6px; left: -6px;
    font-size: 0.55rem; font-weight: bold; color: #fff;
    background: #8B5E3C; border-radius: 50%; width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .seat-customer { font-size: 1.5rem; line-height: 1; }
  .seat-order { font-size: 1rem; line-height: 1; }
  .seat-status { font-size: 0.55rem; font-weight: bold; color: #444; text-align: center; margin-top: 3px; background: rgba(255,255,255,0.75); border-radius: 8px; padding: 1px 4px; }

  .walking-customer {
    position: absolute;
    font-size: 1.5rem;
    transform: translate(-50%, -50%);
    transition: left 0.9s ease-in-out, top 0.9s ease-in-out;
    animation: walkBob 0.3s ease-in-out infinite;
    z-index: 5;
  }
  @keyframes walkBob { 0%, 100% { margin-top: 0; } 50% { margin-top: -4px; } }

  /* きっちん・シンクの そうさパネル（フローティング） */
  .float-panel {
    position: absolute; left: 50%; bottom: 6%;
    transform: translateX(-50%);
    width: 92%; max-width: 380px;
    background: rgba(255,255,255,0.95);
    border-radius: 16px;
    padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    z-index: 8;
  }
  .kitchen-title { font-size: 1rem; font-weight: bold; color: #333; text-align: center; }
  .ingredient-checklist { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .ingredient-check {
    font-size: 1.6rem; width: 42px; height: 42px; border-radius: 10px;
    background: #eee; display: flex; align-items: center; justify-content: center;
    opacity: 0.4;
  }
  .ingredient-check.got { opacity: 1; background: #C8F7C5; }

  .fridge-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .fridge-item {
    font-size: 1.6rem;
    border: none; border-radius: 10px;
    background: #DCEBFF;
    padding: 8px 0;
    cursor: pointer;
  }
  .fridge-item:active { transform: translateY(2px); }
  .fridge-item.used { opacity: 0.35; }

  .cook-station { display: none; flex-direction: column; gap: 8px; align-items: center; }
  .cook-station.show { display: flex; }
  .cook-bar-track {
    width: 100%; height: 26px; background: #eee; border-radius: 999px; position: relative; overflow: hidden;
  }
  .cook-bar-zone {
    position: absolute; top: 0; bottom: 0; background: rgba(76,175,80,0.4);
  }
  .cook-bar-marker {
    position: absolute; top: 0; bottom: 0; width: 6px; background: #333;
  }
  .cook-btn, .finish-btn, .serve-btn, .rinse-btn, .panel-close-btn {
    font-size: 0.95rem; font-weight: bold; padding: 10px 24px; border: none; border-radius: 999px;
    background: #FF9A56; color: #fff; cursor: pointer;
  }
  .cook-btn:active, .finish-btn:active, .serve-btn:active, .rinse-btn:active, .panel-close-btn:active { transform: translateY(3px); }
  .finish-btn { background: #4CAF50; display: none; }
  .finish-btn.show { display: inline-block; }
  .panel-close-btn { background: #999; }

  .sink-panel .sink-icon { font-size: 2.4rem; text-align: center; }
  .rinse-splash { font-size: 1.6rem; opacity: 0; transition: opacity 0.2s; text-align: center; }
  .rinse-splash.on { opacity: 1; }

  .overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.65);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: #fff; text-align: center; z-index: 10; padding: 20px;
    overflow-y: auto;
  }
  .overlay.hide { display: none !important; }
  .hide { display: none !important; }
  .overlay h2 { font-size: 1.7rem; margin: 6px 0; }
  .overlay p { font-size: 1rem; margin: 6px 0 14px; line-height: 1.6; }
</style>
</head>
<body class="game-body">
  <a class="home-link" href="../../index.html">🏠 ホームにもどる</a>
  <button class="mute-btn" id="muteBtn">🔊</button>
  <h1 class="game-title">🍽️ そうすけの レストランタイミング</h1>

  <div class="hud" id="hud">
    <span>サーブした 🍽️ <span id="servedCount">0</span></span>
    <span class="time">のこり ⏱️ <span id="timeLeft">90</span> びょう</span>
  </div>

  <div class="stage-wrap">
    <div class="arena" id="arena">
      <div class="kitchen-zone">
        <span class="kitchen-label">🍳 キッチン</span>
        <div class="kitchen-appliance"><span class="appl-emoji">🧊</span></div>
        <div class="chef-figure"><span class="chef-emoji">👨‍🍳</span></div>
        <div class="kitchen-appliance"><span class="appl-emoji">🔥</span></div>
      </div>

      <div class="door"></div>
      <div class="door-label">🚪 いりぐち</div>

      <div class="sink-zone">
        <span class="sink-basin">🚰</span>
        <span class="sink-label">おてあらい</span>
      </div>

      <div id="tablesLayer"></div>
      <div id="walkersLayer"></div>

      <div class="float-panel hide" id="kitchenPanel">
        <div class="kitchen-title" id="kitchenTitle">-</div>
        <div class="ingredient-checklist" id="ingredientChecklist"></div>
        <div class="fridge-grid" id="fridgeGrid"></div>
        <button class="finish-btn" id="finishBtn">✅ できた！</button>
        <div class="cook-station" id="cookStation">
          <div class="cook-bar-track">
            <div class="cook-bar-zone" id="cookBarZone"></div>
            <div class="cook-bar-marker" id="cookBarMarker"></div>
          </div>
          <button class="cook-btn" id="cookBtn">🔥 やく！</button>
        </div>
        <button class="panel-close-btn" id="kitchenCloseBtn">とじる</button>
      </div>

      <div class="float-panel sink-panel hide" id="sinkPanel">
        <div class="sink-icon">🚰</div>
        <div class="rinse-splash" id="rinseSplash">💦💦💦</div>
        <button class="rinse-btn" id="rinseBtn">ジャー！あらう</button>
      </div>

      <div class="overlay" id="startOverlay">
        <h2>🍽️ レストランタイミング</h2>
        <p>
          おきゃくさんが ドアから きて せきに すわるよ。すわってる せきを タッチして ちゅうもんを うける。<br>
          れいぞうこから ざいりょうを えらんで、フライパンや オーブンで やこう！<br>
          （ちょうどいい ところで「やく！」ボタンを おそう）<br>
          できたら せきに もどって サーブ！ たべおわったら 🚰おてあらいで ジャーッと あらってね。
        </p>
        <button class="big-btn" id="startBtn">▶ スタート</button>
      </div>

      <div class="overlay hide" id="endOverlay">
        <h2>🎉 えいぎょう しゅうりょう！ 🎉</h2>
        <p id="endText"></p>
        <button class="big-btn" id="retryBtn">🔄 もういちど</button>
      </div>
    </div>
  </div>

  <script src="../../audio.js"></script>
  <script src="../../leaderboard.js"></script>
  <script>
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.addEventListener('click', () => {
      const isMuted = GameAudio.toggleMute();
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    const DISHES = {
      sushi: { name: 'おすし', emoji: '🍣', ingredients: ['🍚', '🐟'], station: 'cold' },
      tempura: { name: 'てんぷら', emoji: '🍤', ingredients: ['🍤', '🥕'], station: 'pan' },
      somen: { name: 'そうめん', emoji: '🍜', ingredients: ['🍜', '🥒'], station: 'cold' },
      curry: { name: 'カレー', emoji: '🍛', ingredients: ['🥕', '🥔', '🧅', '🥩'], station: 'oven' },
    };
    const DISH_KEYS = Object.keys(DISHES);
    const FRIDGE_ITEMS = ['🍚', '🐟', '🍤', '🥕', '🍜', '🥒', '🥔', '🧅', '🥩'];
    const CUSTOMER_EMOJIS = ['🧑', '👩', '👨', '👧', '👦', '🧓'];

    const SEAT_COUNT = 5;
    const GAME_TIME = 90;

    // ゆか の どこに テーブルが あるか（%ざひょう）
    const TABLE_POS = [
      { x: 24, y: 46 },
      { x: 50, y: 40 },
      { x: 76, y: 46 },
      { x: 36, y: 76 },
      { x: 64, y: 76 },
    ];
    const DOOR_POS = { x: 3, y: 46 };

    const arenaEl = document.getElementById('arena');
    const tablesLayerEl = document.getElementById('tablesLayer');
    const walkersLayerEl = document.getElementById('walkersLayer');
    const kitchenPanel = document.getElementById('kitchenPanel');
    const kitchenTitleEl = document.getElementById('kitchenTitle');
    const ingredientChecklistEl = document.getElementById('ingredientChecklist');
    const fridgeGridEl = document.getElementById('fridgeGrid');
    const finishBtn = document.getElementById('finishBtn');
    const cookStation = document.getElementById('cookStation');
    const cookBarZone = document.getElementById('cookBarZone');
    const cookBarMarker = document.getElementById('cookBarMarker');
    const cookBtn = document.getElementById('cookBtn');
    const kitchenCloseBtn = document.getElementById('kitchenCloseBtn');
    const sinkPanel = document.getElementById('sinkPanel');
    const rinseSplash = document.getElementById('rinseSplash');
    const rinseBtn = document.getElementById('rinseBtn');
    const servedCountEl = document.getElementById('servedCount');
    const timeLeftEl = document.getElementById('timeLeft');
    const hudEl = document.getElementById('hud');
    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');
    const endTextEl = document.getElementById('endText');

    let seats = [];
    let seatEls = [];
    let activeSeatId = null;
    let activeDish = null;
    let collectedIngredients = [];
    let dishReady = false;
    let sinkSeatId = null;
    let servedCount = 0;
    let timeLeft = GAME_TIME;
    let playing = false;
    let countdownTimer = null;
    let spawnTimer = null;
    let cookProgress = 0, cookDir = 1, cookLoopId = null;
    let cookZoneStart = 0.4, cookZoneEnd = 0.6;

    function resetGame() {
      seats = Array.from({ length: SEAT_COUNT }, (_, i) => ({ id: i, state: 'empty', dish: null }));
      activeSeatId = null;
      activeDish = null;
      collectedIngredients = [];
      dishReady = false;
      sinkSeatId = null;
      servedCount = 0;
      timeLeft = GAME_TIME;
      servedCountEl.textContent = 0;
      timeLeftEl.textContent = timeLeft;
      hudEl.classList.remove('urgent');
      kitchenPanel.classList.add('hide');
      sinkPanel.classList.add('hide');
      walkersLayerEl.innerHTML = '';
    }

    function buildSeats() {
      tablesLayerEl.innerHTML = '';
      seatEls = seats.map(seat => {
        const unit = document.createElement('div');
        unit.className = 'table-unit';
        unit.style.left = TABLE_POS[seat.id].x + '%';
        unit.style.top = TABLE_POS[seat.id].y + '%';
        unit.addEventListener('click', () => onSeatTap(seat.id));
        tablesLayerEl.appendChild(unit);
        return unit;
      });
    }

    function renderSeats() {
      seats.forEach(seat => {
        const el = seatEls[seat.id];
        el.classList.toggle('active', seat.id === activeSeatId);
        el.classList.remove('tappable');
        let inner = `<div class="chair-graphic"></div><div class="table-graphic"><span class="seat-num">${seat.id + 1}</span>`;
        if (seat.state === 'empty') {
          inner += `</div><div class="seat-status">あき せき</div>`;
        } else if (seat.state === 'waiting') {
          const readyMark = (seat.id === activeSeatId && dishReady);
          el.classList.add('tappable');
          inner += `<span class="seat-customer">${seat.customerEmoji}</span><span class="seat-order">${DISHES[seat.dish].emoji}</span></div><div class="seat-status">${readyMark ? 'サーブ できる！' : 'ちゅうもんちゅう'}</div>`;
        } else if (seat.state === 'eating') {
          inner += `<span class="seat-customer">${seat.customerEmoji}</span><span class="seat-order">${DISHES[seat.dish].emoji}😋</span></div><div class="seat-status">たべてるよ</div>`;
        } else if (seat.state === 'dirty') {
          el.classList.add('tappable');
          inner += `<span class="seat-customer">🍽️</span></div><div class="seat-status">あらってね</div>`;
        } else {
          inner += `</div>`;
        }
        el.innerHTML = inner;
      });
    }

    function spawnCustomer() {
      if (!playing) return;
      const emptySeats = seats.filter(s => s.state === 'empty');
      if (emptySeats.length === 0) return;
      const seat = emptySeats[Math.floor(Math.random() * emptySeats.length)];
      const dish = DISH_KEYS[Math.floor(Math.random() * DISH_KEYS.length)];
      const customerEmoji = CUSTOMER_EMOJIS[Math.floor(Math.random() * CUSTOMER_EMOJIS.length)];

      // ドアから あるいて きて、せきに つく えんしゅつ
      const walker = document.createElement('div');
      walker.className = 'walking-customer';
      walker.textContent = customerEmoji;
      walker.style.left = DOOR_POS.x + '%';
      walker.style.top = DOOR_POS.y + '%';
      walkersLayerEl.appendChild(walker);
      GameAudio.playClickTick();
      requestAnimationFrame(() => {
        walker.style.left = TABLE_POS[seat.id].x + '%';
        walker.style.top = (TABLE_POS[seat.id].y - 6) + '%';
      });

      setTimeout(() => {
        walker.remove();
        seat.state = 'waiting';
        seat.dish = dish;
        seat.customerEmoji = customerEmoji;
        renderSeats();
      }, 900);
    }

    function onSeatTap(seatId) {
      if (!playing) return;
      const seat = seats[seatId];
      if (seat.state === 'waiting') {
        if (dishReady && seatId === activeSeatId) {
          serveSeat(seatId);
        } else if (activeSeatId === null) {
          openKitchenFor(seatId);
        }
      } else if (seat.state === 'dirty') {
        openSinkFor(seatId);
      }
    }

    function openKitchenFor(seatId) {
      activeSeatId = seatId;
      activeDish = DISHES[seats[seatId].dish];
      collectedIngredients = [];
      dishReady = false;
      GameAudio.playClickTick();
      renderKitchen();
      kitchenPanel.classList.remove('hide');
      sinkPanel.classList.add('hide');
      renderSeats();
    }

    function renderKitchen() {
      kitchenTitleEl.textContent = `${activeDish.emoji} ${activeDish.name} を つくろう！`;
      ingredientChecklistEl.innerHTML = '';
      activeDish.ingredients.forEach(ing => {
        const box = document.createElement('div');
        box.className = 'ingredient-check' + (collectedIngredients.includes(ing) ? ' got' : '');
        box.textContent = ing;
        ingredientChecklistEl.appendChild(box);
      });

      fridgeGridEl.innerHTML = '';
      FRIDGE_ITEMS.forEach(ing => {
        const btn = document.createElement('button');
        const needed = activeDish.ingredients.includes(ing);
        const used = collectedIngredients.includes(ing);
        btn.className = 'fridge-item' + (used ? ' used' : '');
        btn.textContent = ing;
        btn.addEventListener('click', () => {
          if (!needed || used) return;
          collectedIngredients.push(ing);
          GameAudio.playClickTick();
          renderKitchen();
        });
        fridgeGridEl.appendChild(btn);
      });

      const allCollected = activeDish.ingredients.every(ing => collectedIngredients.includes(ing));
      if (allCollected) {
        if (activeDish.station === 'cold') {
          finishBtn.classList.add('show');
          cookStation.classList.remove('show');
        } else {
          finishBtn.classList.remove('show');
          cookStation.classList.add('show');
          startCookLoop();
        }
      } else {
        finishBtn.classList.remove('show');
        cookStation.classList.remove('show');
        stopCookLoop();
      }
    }

    function startCookLoop() {
      if (cookLoopId) return;
      cookProgress = 0;
      cookDir = 1;
      cookBarZone.style.left = (cookZoneStart * 100) + '%';
      cookBarZone.style.width = ((cookZoneEnd - cookZoneStart) * 100) + '%';
      function loop() {
        if (!cookStation.classList.contains('show')) { cookLoopId = null; return; }
        cookProgress += cookDir * 0.018;
        if (cookProgress >= 1) { cookProgress = 1; cookDir = -1; }
        if (cookProgress <= 0) { cookProgress = 0; cookDir = 1; }
        cookBarMarker.style.left = (cookProgress * 100) + '%';
        cookLoopId = requestAnimationFrame(loop);
      }
      loop();
    }
    function stopCookLoop() {
      if (cookLoopId) cancelAnimationFrame(cookLoopId);
      cookLoopId = null;
    }

    cookBtn.addEventListener('click', () => {
      if (cookProgress >= cookZoneStart && cookProgress <= cookZoneEnd) {
        GameAudio.playClearFanfare();
        stopCookLoop();
        cookStation.classList.remove('show');
        markDishReady();
      } else {
        GameAudio.playFailBuzz();
      }
    });

    finishBtn.addEventListener('click', () => {
      GameAudio.playClickTick();
      finishBtn.classList.remove('show');
      markDishReady();
    });

    kitchenCloseBtn.addEventListener('click', () => {
      GameAudio.playClickTick();
      kitchenPanel.classList.add('hide');
      if (!dishReady) {
        // まだ できてない ときは、この ちゅうもんを あきらめて べつの せきを えらべるように する
        stopCookLoop();
        activeSeatId = null;
        activeDish = null;
        collectedIngredients = [];
      }
      renderSeats();
    });

    function markDishReady() {
      dishReady = true;
      kitchenPanel.classList.add('hide');
      renderSeats();
    }

    function serveSeat(seatId) {
      const seat = seats[seatId];
      seat.state = 'eating';
      GameAudio.playClickTick();
      activeSeatId = null;
      activeDish = null;
      collectedIngredients = [];
      dishReady = false;
      renderSeats();
      setTimeout(() => {
        if (!playing) return;
        seat.state = 'dirty';
        servedCount++;
        servedCountEl.textContent = servedCount;
        renderSeats();
      }, 3000 + Math.random() * 1500);
    }

    function openSinkFor(seatId) {
      sinkSeatId = seatId;
      sinkPanel.classList.remove('hide');
      kitchenPanel.classList.add('hide');
    }

    rinseBtn.addEventListener('click', () => {
      if (sinkSeatId === null) return;
      GameAudio.playClickTick();
      rinseSplash.classList.add('on');
      setTimeout(() => rinseSplash.classList.remove('on'), 300);
      const seat = seats[sinkSeatId];
      seat.state = 'empty';
      seat.dish = null;
      sinkSeatId = null;
      sinkPanel.classList.add('hide');
      renderSeats();
    });

    function startGame() {
      resetGame();
      buildSeats();
      renderSeats();
      startOverlay.classList.add('hide');
      endOverlay.classList.add('hide');
      playing = true;
      GameAudio.playBGM();

      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        if (!playing) return;
        timeLeft--;
        timeLeftEl.textContent = timeLeft;
        if (timeLeft <= 15) hudEl.classList.add('urgent');
        if (timeLeft <= 0) {
          timeLeftEl.textContent = 0;
          endGame();
        }
      }, 1000);

      clearInterval(spawnTimer);
      spawnTimer = setInterval(spawnCustomer, 3500);
      spawnCustomer();
    }

    function endGame() {
      playing = false;
      clearInterval(countdownTimer);
      clearInterval(spawnTimer);
      stopCookLoop();
      GameAudio.stopBGM();
      GameAudio.playClearFanfare();
      endTextEl.textContent = `${servedCount}にんの おきゃくさんに サーブできたね！`;
      endOverlay.classList.remove('hide');
      Leaderboard.showRankFlow({ gameId: 'restaurant', score: servedCount, higherIsBetter: true, unit: 'にん', title: '🍽️ サーブした にんずう ランキング' });
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);

    buildSeats();
    renderSeats();
  </script>
</body>
</html>
