<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>そうすけの まちあるき</title>
<link rel="stylesheet" href="../../style.css">
<style>
  body { background: linear-gradient(135deg, #7EC8E3 0%, #A6F3B7 100%); background-attachment: fixed; }

  .stage-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
  }

  .hud {
    display: flex; flex-wrap: wrap; gap: 16px; font-size: 1.05rem; font-weight: bold;
    background: rgba(255,255,255,0.85); border-radius: 16px; padding: 8px 18px;
    margin-bottom: 14px;
  }

  .arena {
    position: relative;
    width: 100%;
    height: 460px;
    border-radius: 20px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 12px 24px rgba(0,0,0,0.2);
    overflow: hidden;
    transition: background 0.4s ease;
  }

  .town-label {
    position: absolute; top: 4%; left: 50%; transform: translateX(-50%);
    font-size: 0.7rem; font-weight: bold; color: #444;
    background: rgba(255,255,255,0.8); padding: 3px 14px; border-radius: 999px;
    white-space: nowrap;
    z-index: 5;
  }

  .building {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: box-shadow 0.15s ease;
  }
  .building .b-emoji {
    font-size: 3.2rem;
    background: rgba(255,255,255,0.5);
    border-radius: 16px;
    padding: 6px 10px;
  }
  .building.near .b-emoji { box-shadow: 0 0 0 4px #FFD166; border-radius: 16px; }
  .building .b-name { font-size: 0.55rem; font-weight: bold; color: #333; background: rgba(255,255,255,0.85); border-radius: 8px; padding: 1px 6px; }

  .npc {
    position: absolute;
    font-size: 2.2rem;
    transform: translate(-50%, -50%);
  }

  .player {
    position: absolute;
    font-size: 2.2rem;
    transform: translate(-50%, -50%);
    z-index: 6;
  }

  .controls-row {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 16px;
    margin-top: 16px;
  }
  .dpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(3, 58px);
    gap: 6px;
  }
  .dpad-btn {
    font-size: 1.4rem;
    border: none; border-radius: 12px;
    background: #fff;
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    cursor: pointer; user-select: none; touch-action: none;
  }
  .dpad-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .dpad-btn.empty { visibility: hidden; }

  .enter-btn, .next-btn {
    font-size: 1rem; font-weight: bold; padding: 16px 22px; border: none; border-radius: 16px;
    color: #fff; cursor: pointer; user-select: none;
    background: #999; box-shadow: 0 5px 0 #666;
  }
  .enter-btn.ready, .next-btn.ready { background: #FF9A56; box-shadow: 0 5px 0 #c96e2e; }
  .enter-btn:active:not(:disabled), .next-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .enter-btn:disabled, .next-btn:disabled { opacity: 0.5; cursor: default; }

  /* たてもの の なか */
  .indoor-panel {
    position: absolute; inset: 0;
    background: #FFF8ED;
    border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 20px;
    box-sizing: border-box;
  }
  .indoor-panel.hide { display: none; }
  .indoor-scene { display: flex; align-items: flex-end; gap: 28px; }
  .indoor-npc { font-size: 3.4rem; }
  .indoor-furniture { font-size: 4.2rem; position: relative; }
  .indoor-player { font-size: 3rem; }
  .indoor-title { font-size: 1.1rem; font-weight: bold; color: #333; text-align: center; }
  .indoor-msg { font-size: 1rem; font-weight: bold; color: #4CAF50; min-height: 24px; text-align: center; }
  .action-btn {
    font-size: 1.05rem; font-weight: bold; padding: 14px 26px; border: none; border-radius: 999px;
    background: #FF5D8F; color: #fff; cursor: pointer;
    box-shadow: 0 5px 0 #c73f6a;
  }
  .action-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #c73f6a; }
  .action-btn:disabled { opacity: 0.5; cursor: default; }
  .indoor-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .back-btn {
    font-size: 0.95rem; font-weight: bold; padding: 10px 20px; border: none; border-radius: 999px;
    background: #999; color: #fff; cursor: pointer;
  }
  .back-btn:active { transform: translateY(2px); }

  .overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.65);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: #fff; text-align: center; z-index: 10; padding: 20px;
    overflow-y: auto;
  }
  .overlay.hide { display: none !important; }
  .overlay h2 { font-size: 1.7rem; margin: 6px 0; }
  .overlay p { font-size: 1rem; margin: 6px 0 14px; line-height: 1.6; }
</style>
</head>
<body class="game-body">
  <a class="home-link" href="../../index.html">🏠 ホームにもどる</a>
  <button class="mute-btn" id="muteBtn">🔊</button>
  <h1 class="game-title">🚶 そうすけの まちあるき</h1>

  <div class="hud">
    <span>まち 🗺️ <span id="stageCount">1</span>/<span id="stageTotal">5</span></span>
  </div>

  <div class="stage-wrap">
    <div class="arena" id="arena">
      <span class="town-label" id="townLabel">-</span>
      <div class="building" id="building">
        <span class="b-emoji" id="buildingEmoji">🏠</span>
        <span class="b-name" id="buildingName">-</span>
      </div>
      <span class="npc" id="npc">🧑</span>
      <span class="player" id="player">🧑‍🦱</span>

      <div class="indoor-panel hide" id="indoorPanel">
        <div class="indoor-title" id="indoorTitle">-</div>
        <div class="indoor-scene">
          <span class="indoor-npc" id="indoorNpc">🧑</span>
          <span class="indoor-furniture" id="indoorFurniture">🪑</span>
          <span class="indoor-player" id="indoorPlayer">🧑‍🦱</span>
        </div>
        <div class="indoor-msg" id="indoorMsg">&nbsp;</div>
        <div class="indoor-row">
          <button class="action-btn" id="actionBtn">-</button>
          <button class="back-btn" id="backBtn">🚪 まちに もどる</button>
        </div>
      </div>

      <div class="overlay" id="startOverlay">
        <h2>🚶 まちあるき</h2>
        <p>
          やじるしで まちを あるいて、たてものに ちかづくと「はいる」ボタンが おせるよ。<br>
          なかで いろんな ことを してみよう！5つの まちを まわろう。
        </p>
        <button class="big-btn" id="startBtn">▶ スタート</button>
      </div>

      <div class="overlay hide" id="endOverlay">
        <h2>🎉 おわり！ 🎉</h2>
        <p id="endText"></p>
        <button class="big-btn" id="retryBtn">🔄 もういちど</button>
      </div>
    </div>
  </div>

  <div class="controls-row">
    <div class="dpad-grid">
      <button class="dpad-btn empty"></button>
      <button class="dpad-btn" id="btnUp">⬆️</button>
      <button class="dpad-btn empty"></button>
      <button class="dpad-btn" id="btnLeft">⬅️</button>
      <button class="dpad-btn empty"></button>
      <button class="dpad-btn" id="btnRight">➡️</button>
      <button class="dpad-btn empty"></button>
      <button class="dpad-btn" id="btnDown">⬇️</button>
      <button class="dpad-btn empty"></button>
    </div>
    <button class="enter-btn" id="enterBtn" disabled>🚪 はいる</button>
    <button class="next-btn hide" id="nextBtn" disabled>▶ つぎの まちへ</button>
  </div>

  <script src="../../audio.js?v=9"></script>
  <script src="../../leaderboard.js?v=2"></script>
  <script>
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.addEventListener('click', () => {
      const isMuted = GameAudio.toggleMute();
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    const TOWNS = [
      {
        name: 'ピザタウン', bg: 'linear-gradient(#FFE0B2 0%, #FFCC80 100%)',
        buildingEmoji: '🍕', buildingName: 'ピザや', npc: '👨‍🍳',
        indoorTitle: '🍕 ピザやさん', indoorNpc: '👨‍🍳', furniture: '🍽️',
        actionLabel: '😋 たべる', actionMsg: 'せきに すわって、あつあつの ピザを たべた！ おいしい！',
      },
      {
        name: 'ホテルタウン', bg: 'linear-gradient(#D6C7F0 0%, #B3A0DE 100%)',
        buildingEmoji: '🏨', buildingName: 'ホテル', npc: '🧑‍💼',
        indoorTitle: '🏨 ホテル', indoorNpc: '🧑‍💼', furniture: '🛏️',
        actionLabel: '😴 ねる', actionMsg: 'ふかふかの ベッドで、ぐっすり おひるねした！',
      },
      {
        name: 'コンビニタウン', bg: 'linear-gradient(#C8F7C5 0%, #A6E8A0 100%)',
        buildingEmoji: '🏪', buildingName: 'コンビニ', npc: '🧑',
        indoorTitle: '🏪 コンビニ', indoorNpc: '🧑', furniture: '🍬',
        actionLabel: '🛍️ かう', actionMsg: 'すきな おかしを かって、うれしくなった！',
      },
      {
        name: 'ゆうえんちタウン', bg: 'linear-gradient(#FFC1E3 0%, #FF9ECF 100%)',
        buildingEmoji: '🎡', buildingName: 'ゆうえんち', npc: '🎪',
        indoorTitle: '🎡 ゆうえんち', indoorNpc: '🎪', furniture: '🎢',
        actionLabel: '🎢 のる', actionMsg: 'かんらんしゃに のって、まちが きらきら みえた！',
      },
      {
        name: 'がっこうタウン', bg: 'linear-gradient(#B3E0F2 0%, #8FCDE8 100%)',
        buildingEmoji: '🏫', buildingName: 'がっこう', npc: '👩‍🏫',
        indoorTitle: '🏫 がっこう', indoorNpc: '👩‍🏫', furniture: '📖',
        actionLabel: '✏️ べんきょうする', actionMsg: 'つくえで べんきょうして、あたらしい ことを おぼえた！',
      },
    ];
    const BUILDING_POS = { x: 50, y: 30 };
    const NPC_POS = { x: 66, y: 34 };
    const PLAYER_HOME = { x: 50, y: 85 };
    const PROXIMITY = 60;

    const arenaEl = document.getElementById('arena');
    const townLabelEl = document.getElementById('townLabel');
    const buildingEl = document.getElementById('building');
    const buildingEmojiEl = document.getElementById('buildingEmoji');
    const buildingNameEl = document.getElementById('buildingName');
    const npcEl = document.getElementById('npc');
    const playerEl = document.getElementById('player');
    const enterBtn = document.getElementById('enterBtn');
    const nextBtn = document.getElementById('nextBtn');
    const stageCountEl = document.getElementById('stageCount');
    const stageTotalEl = document.getElementById('stageTotal');

    const indoorPanel = document.getElementById('indoorPanel');
    const indoorTitleEl = document.getElementById('indoorTitle');
    const indoorNpcEl = document.getElementById('indoorNpc');
    const indoorFurnitureEl = document.getElementById('indoorFurniture');
    const indoorMsgEl = document.getElementById('indoorMsg');
    const actionBtn = document.getElementById('actionBtn');
    const backBtn = document.getElementById('backBtn');

    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');
    const endTextEl = document.getElementById('endText');

    stageTotalEl.textContent = TOWNS.length;

    let townIndex = 0;
    let playerX = 0, playerY = 0;
    let input = { up: false, down: false, left: false, right: false };
    let playing = false;
    let indoors = false;
    let actionDone = false;
    let nearBuilding = false;
    let lastFrame = 0;

    function pxOf(pctX, pctY) {
      return { x: arenaEl.clientWidth * pctX / 100, y: arenaEl.clientHeight * pctY / 100 };
    }

    function loadTown() {
      const t = TOWNS[townIndex];
      arenaEl.style.background = t.bg;
      townLabelEl.textContent = `🗺️ ${t.name}`;
      buildingEmojiEl.textContent = t.buildingEmoji;
      buildingNameEl.textContent = t.buildingName;
      npcEl.textContent = t.npc;
      buildingEl.style.left = BUILDING_POS.x + '%';
      buildingEl.style.top = BUILDING_POS.y + '%';
      npcEl.style.left = NPC_POS.x + '%';
      npcEl.style.top = NPC_POS.y + '%';
      stageCountEl.textContent = townIndex + 1;

      indoorTitleEl.textContent = t.indoorTitle;
      indoorNpcEl.textContent = t.indoorNpc;
      indoorFurnitureEl.textContent = t.furniture;
      actionBtn.textContent = t.actionLabel;

      actionDone = false;
      nextBtn.disabled = true;
      nextBtn.classList.remove('ready');

      const home = pxOf(PLAYER_HOME.x, PLAYER_HOME.y);
      playerX = home.x; playerY = home.y;
      playerEl.style.left = playerX + 'px';
      playerEl.style.top = playerY + 'px';
      updateNearBuilding();
    }

    function updateNearBuilding() {
      const p = pxOf(BUILDING_POS.x, BUILDING_POS.y);
      const dist = Math.hypot(playerX - p.x, playerY - p.y);
      nearBuilding = dist < PROXIMITY;
      buildingEl.classList.toggle('near', nearBuilding);
      enterBtn.disabled = !nearBuilding;
      enterBtn.classList.toggle('ready', nearBuilding);
    }

    function update(dt) {
      if (!playing || indoors) return;
      const speed = 150;
      let dx = 0, dy = 0;
      if (input.up) dy -= 1;
      if (input.down) dy += 1;
      if (input.left) dx -= 1;
      if (input.right) dx += 1;
      if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
      playerX = Math.max(14, Math.min(arenaEl.clientWidth - 14, playerX + dx * speed * dt));
      playerY = Math.max(14, Math.min(arenaEl.clientHeight - 14, playerY + dy * speed * dt));
      playerEl.style.left = playerX + 'px';
      playerEl.style.top = playerY + 'px';
      updateNearBuilding();
    }

    function loop(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      update(dt);
      requestAnimationFrame(loop);
    }

    function setDir(dir, value) { input[dir] = value; }
    ['Up', 'Down', 'Left', 'Right'].forEach(dir => {
      const key = dir.toLowerCase();
      const btn = document.getElementById('btn' + dir);
      btn.addEventListener('pointerdown', () => setDir(key, true));
      btn.addEventListener('pointerup', () => setDir(key, false));
      btn.addEventListener('pointerleave', () => setDir(key, false));
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') input.up = true;
      if (e.key === 'ArrowDown') input.down = true;
      if (e.key === 'ArrowLeft') input.left = true;
      if (e.key === 'ArrowRight') input.right = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp') input.up = false;
      if (e.key === 'ArrowDown') input.down = false;
      if (e.key === 'ArrowLeft') input.left = false;
      if (e.key === 'ArrowRight') input.right = false;
    });

    function enterBuilding() {
      if (!playing || indoors || !nearBuilding) return;
      indoors = true;
      input = { up: false, down: false, left: false, right: false };
      indoorMsgEl.textContent = '';
      actionBtn.disabled = false;
      indoorPanel.classList.remove('hide');
      GameAudio.playClickTick();
    }

    function doAction() {
      if (!indoors || actionDone) return;
      actionDone = true;
      actionBtn.disabled = true;
      const t = TOWNS[townIndex];
      indoorMsgEl.textContent = t.actionMsg;
      GameAudio.playClearFanfare();
    }

    function leaveBuilding() {
      if (!indoors) return;
      indoors = false;
      indoorPanel.classList.add('hide');
      if (actionDone) {
        nextBtn.disabled = false;
        nextBtn.classList.add('ready');
      }
      updateNearBuilding();
    }

    function goNextTown() {
      if (!actionDone) return;
      townIndex++;
      if (townIndex >= TOWNS.length) {
        finishGame();
        return;
      }
      loadTown();
      GameAudio.playClickTick();
    }

    function finishGame() {
      playing = false;
      GameAudio.stopBGM();
      GameAudio.playClearFanfare();
      endTextEl.textContent = `5つの まちを ぜんぶ まわって、いろんな たいけんを したね！`;
      endOverlay.classList.remove('hide');
      Leaderboard.showRankFlow({ gameId: 'town-walk', score: TOWNS.length, higherIsBetter: true, unit: 'まち', title: '🚶 まわった まち ランキング' });
    }

    enterBtn.addEventListener('click', enterBuilding);
    actionBtn.addEventListener('click', doAction);
    backBtn.addEventListener('click', leaveBuilding);
    nextBtn.addEventListener('click', goNextTown);

    function startGame() {
      townIndex = 0;
      playing = true;
      indoors = false;
      indoorPanel.classList.add('hide');
      startOverlay.classList.add('hide');
      endOverlay.classList.add('hide');
      GameAudio.playBGM();
      loadTown();
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);

    loadTown();
    lastFrame = performance.now();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
