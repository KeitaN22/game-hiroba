<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>そうすけの かくれんぼ</title>
<link rel="stylesheet" href="../../style.css">
<style>
  body { background: linear-gradient(135deg, #FFC1E3 0%, #6EE7F9 100%); background-attachment: fixed; }

  .stage-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
  }

  .hud {
    display: flex; flex-wrap: wrap; gap: 16px; font-size: 1.05rem; font-weight: bold;
    background: rgba(255,255,255,0.85); border-radius: 16px; padding: 8px 18px;
    margin-bottom: 14px;
  }

  .arena {
    position: relative;
    width: 100%;
    height: 460px;
    border-radius: 20px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 12px 24px rgba(0,0,0,0.2);
    overflow: hidden;
    background:
      linear-gradient(90deg, #FFE6C7 0 45%, transparent 45% 55%, #E6F5D9 55% 100%),
      linear-gradient(#FFF3E0 0 50%, #F0F8E8 50% 100%);
  }
  .room-label {
    position: absolute;
    font-size: 0.6rem; font-weight: bold; color: #556;
    background: rgba(255,255,255,0.7); padding: 2px 8px; border-radius: 999px;
  }

  .spot {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: box-shadow 0.15s ease;
  }
  .spot .spot-emoji {
    font-size: 2.2rem;
    background: rgba(255,255,255,0.6);
    border-radius: 14px;
    padding: 6px 8px;
  }
  .spot.near .spot-emoji { box-shadow: 0 0 0 4px #FFD166; border-radius: 14px; }
  .spot-name { font-size: 0.55rem; font-weight: bold; color: #444; background: rgba(255,255,255,0.8); border-radius: 8px; padding: 1px 5px; max-width: 70px; text-align: center; }

  .player {
    position: absolute;
    font-size: 2rem;
    transform: translate(-50%, -50%);
    transition: left 0.1s linear, top 0.1s linear, opacity 0.3s ease;
    z-index: 6;
  }
  .player.hidden-away { opacity: 0.15; }

  .seeker {
    position: absolute;
    font-size: 2rem;
    transform: translate(-50%, -50%);
    transition: left 1.1s ease-in-out, top 1.1s ease-in-out;
    z-index: 7;
    opacity: 0;
  }
  .seeker.active { opacity: 1; }
  .seeker.checking { animation: seekerLook 0.5s ease-in-out 2; }
  @keyframes seekerLook { 0%,100% { transform: translate(-50%, -50%) rotate(0deg); } 50% { transform: translate(-50%, -50%) rotate(15deg); } }

  .controls-row {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 16px;
    margin-top: 16px;
  }
  .dpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(3, 58px);
    gap: 6px;
  }
  .dpad-btn {
    font-size: 1.4rem;
    border: none; border-radius: 12px;
    background: #fff;
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    cursor: pointer; user-select: none; touch-action: none;
  }
  .dpad-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .dpad-btn.empty { visibility: hidden; }

  .hide-btn {
    font-size: 1rem; font-weight: bold; padding: 16px 22px; border: none; border-radius: 16px;
    color: #fff; cursor: pointer; user-select: none;
    background: #999; box-shadow: 0 5px 0 #666;
  }
  .hide-btn.ready { background: #FF9A56; box-shadow: 0 5px 0 #c96e2e; }
  .hide-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .hide-btn:disabled { opacity: 0.6; cursor: default; }

  .overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.65);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: #fff; text-align: center; z-index: 10; padding: 20px;
    overflow-y: auto;
  }
  .overlay.hide { display: none !important; }
  .overlay h2 { font-size: 1.7rem; margin: 6px 0; }
  .overlay p { font-size: 1rem; margin: 6px 0 14px; line-height: 1.6; }
</style>
</head>
<body class="game-body">
  <a class="home-link" href="../../index.html">🏠 ホームにもどる</a>
  <button class="mute-btn" id="muteBtn">🔊</button>
  <h1 class="game-title">🙈 そうすけの かくれんぼ</h1>

  <div class="hud" id="hud">
    <span id="statusText">やじるしで うごいて、かくれる ばしょを さがそう</span>
  </div>

  <div class="stage-wrap">
    <div class="arena" id="arena">
      <span class="room-label" style="left:4%; top:4%;">🍳 キッチン</span>
      <span class="room-label" style="left:70%; top:4%;">🛏️ じぶんの へや</span>
      <span class="room-label" style="left:38%; top:60%;">🛋️ リビング</span>

      <div id="spotsLayer"></div>
      <div class="player" id="player">🧑</div>
      <div class="seeker" id="seeker">🧒</div>

      <div class="overlay" id="startOverlay">
        <h2>🙈 かくれんぼ</h2>
        <p>
          やじるしボタンで うごいて、かくれる ばしょの ちかくに いこう。<br>
          ちかづくと「ここに かくれる」ボタンが おせるように なるよ。<br>
          かくれたら、オニが さがしに くるよ。みつからなければ かち！
        </p>
        <button class="big-btn" id="startBtn">▶ スタート</button>
      </div>

      <div class="overlay hide" id="endOverlay">
        <h2 id="endTitle">🎉 おわり！ 🎉</h2>
        <p id="endText"></p>
        <button class="big-btn" id="retryBtn">🔄 もういちど</button>
      </div>
    </div>
  </div>

  <div class="controls-row">
    <div class="dpad-grid">
      <button class="dpad-btn empty"></button>
      <button class="dpad-btn" id="btnUp">⬆️</button>
      <button class="dpad-btn empty"></button>
      <button class="dpad-btn" id="btnLeft">⬅️</button>
      <button class="dpad-btn empty"></button>
      <button class="dpad-btn" id="btnRight">➡️</button>
      <button class="dpad-btn empty"></button>
      <button class="dpad-btn" id="btnDown">⬇️</button>
      <button class="dpad-btn empty"></button>
    </div>
    <button class="hide-btn" id="hideBtn" disabled>🙈 ここに かくれる</button>
  </div>

  <script src="../../audio.js?v=9"></script>
  <script src="../../leaderboard.js?v=2"></script>
  <script>
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.addEventListener('click', () => {
      const isMuted = GameAudio.toggleMute();
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    const HIDING_SPOTS = [
      { id: 'closet', name: 'クローゼットの なか', emoji: '🚪', x: 78, y: 20 },
      { id: 'kitchen', name: 'キッチンの うらがわ', emoji: '🍳', x: 14, y: 25 },
      { id: 'table', name: 'テーブルの した', emoji: '🪑', x: 38, y: 78 },
      { id: 'bed', name: 'ベッドの した', emoji: '🛏️', x: 88, y: 60 },
      { id: 'curtain', name: 'カーテンの うしろ', emoji: '🪟', x: 55, y: 40 },
    ];
    const SEEKER_CHECK_COUNT = 3;
    const PLAYER_HOME = { x: 50, y: 92 };
    const SEEKER_HOME = { x: 4, y: 92 };
    const PROXIMITY = 46;
    const SEEKER_START_DELAY = 1100;
    const SEEKER_CHECK_GAP = 2400;
    const SEEKER_LOOK_TIME = 900;

    const arenaEl = document.getElementById('arena');
    const spotsLayerEl = document.getElementById('spotsLayer');
    const playerEl = document.getElementById('player');
    const seekerEl = document.getElementById('seeker');
    const statusTextEl = document.getElementById('statusText');
    const hideBtn = document.getElementById('hideBtn');
    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');
    const endTitleEl = document.getElementById('endTitle');
    const endTextEl = document.getElementById('endText');

    let spotEls = {};
    let playerX = 0, playerY = 0;
    let input = { up: false, down: false, left: false, right: false };
    let playing = false;
    let playerHidden = false;
    let hiddenSpotId = null;
    let nearSpotId = null;
    let seekerTimers = [];
    let lastFrame = 0;

    function pxOf(pctX, pctY) {
      return { x: arenaEl.clientWidth * pctX / 100, y: arenaEl.clientHeight * pctY / 100 };
    }

    function renderSpots() {
      spotsLayerEl.innerHTML = '';
      spotEls = {};
      HIDING_SPOTS.forEach(spot => {
        const el = document.createElement('div');
        el.className = 'spot';
        el.style.left = spot.x + '%';
        el.style.top = spot.y + '%';
        el.innerHTML = `<span class="spot-emoji">${spot.emoji}</span><span class="spot-name">${spot.name}</span>`;
        spotsLayerEl.appendChild(el);
        spotEls[spot.id] = el;
      });
    }

    function clearSeekerTimers() {
      seekerTimers.forEach(t => clearTimeout(t));
      seekerTimers = [];
    }

    function resetGame() {
      clearSeekerTimers();
      playerHidden = false;
      hiddenSpotId = null;
      nearSpotId = null;
      const home = pxOf(PLAYER_HOME.x, PLAYER_HOME.y);
      playerX = home.x;
      playerY = home.y;
      playerEl.style.left = playerX + 'px';
      playerEl.style.top = playerY + 'px';
      playerEl.classList.remove('hidden-away');
      const shome = pxOf(SEEKER_HOME.x, SEEKER_HOME.y);
      seekerEl.style.left = shome.x + 'px';
      seekerEl.style.top = shome.y + 'px';
      seekerEl.classList.remove('active', 'checking');
      hideBtn.disabled = true;
      hideBtn.classList.remove('ready');
      statusTextEl.textContent = 'やじるしで うごいて、かくれる ばしょを さがそう';
      renderSpots();
    }

    function findNearestSpot() {
      let best = null, bestDist = Infinity;
      HIDING_SPOTS.forEach(spot => {
        const p = pxOf(spot.x, spot.y);
        const d = Math.hypot(playerX - p.x, playerY - p.y);
        if (d < PROXIMITY && d < bestDist) { bestDist = d; best = spot; }
      });
      return best;
    }

    function update(dt) {
      if (!playing || playerHidden) return;
      const speed = 150;
      let dx = 0, dy = 0;
      if (input.up) dy -= 1;
      if (input.down) dy += 1;
      if (input.left) dx -= 1;
      if (input.right) dx += 1;
      if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
      playerX = Math.max(14, Math.min(arenaEl.clientWidth - 14, playerX + dx * speed * dt));
      playerY = Math.max(14, Math.min(arenaEl.clientHeight - 14, playerY + dy * speed * dt));
      playerEl.style.left = playerX + 'px';
      playerEl.style.top = playerY + 'px';

      const nearest = findNearestSpot();
      const newNearId = nearest ? nearest.id : null;
      if (newNearId !== nearSpotId) {
        Object.values(spotEls).forEach(el => el.classList.remove('near'));
        if (newNearId) spotEls[newNearId].classList.add('near');
        nearSpotId = newNearId;
      }
      hideBtn.disabled = !nearSpotId;
      hideBtn.classList.toggle('ready', !!nearSpotId);
      hideBtn.textContent = nearSpotId ? `🙈 ${HIDING_SPOTS.find(s => s.id === nearSpotId).name}に かくれる` : '🙈 ここに かくれる';
    }

    function loop(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      update(dt);
      requestAnimationFrame(loop);
    }

    function setDir(dir, value) { input[dir] = value; }
    ['Up', 'Down', 'Left', 'Right'].forEach(dir => {
      const key = dir.toLowerCase();
      const btn = document.getElementById('btn' + dir);
      btn.addEventListener('pointerdown', () => setDir(key, true));
      btn.addEventListener('pointerup', () => setDir(key, false));
      btn.addEventListener('pointerleave', () => setDir(key, false));
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') input.up = true;
      if (e.key === 'ArrowDown') input.down = true;
      if (e.key === 'ArrowLeft') input.left = true;
      if (e.key === 'ArrowRight') input.right = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp') input.up = false;
      if (e.key === 'ArrowDown') input.down = false;
      if (e.key === 'ArrowLeft') input.left = false;
      if (e.key === 'ArrowRight') input.right = false;
    });

    function hideHere() {
      if (!playing || playerHidden || !nearSpotId) return;
      playerHidden = true;
      hiddenSpotId = nearSpotId;
      input = { up: false, down: false, left: false, right: false };
      const spot = HIDING_SPOTS.find(s => s.id === hiddenSpotId);
      const p = pxOf(spot.x, spot.y);
      playerX = p.x; playerY = p.y;
      playerEl.style.left = playerX + 'px';
      playerEl.style.top = playerY + 'px';
      playerEl.classList.add('hidden-away');
      hideBtn.disabled = true;
      hideBtn.classList.remove('ready');
      statusTextEl.textContent = `${spot.name}に かくれた！オニが さがしにくるよ…`;
      GameAudio.playClickTick();
      startSeeker();
    }

    function startSeeker() {
      const shuffled = HIDING_SPOTS.slice().sort(() => Math.random() - 0.5);
      const plan = shuffled.slice(0, SEEKER_CHECK_COUNT);
      seekerEl.classList.add('active');

      let elapsed = SEEKER_START_DELAY;
      plan.forEach((spot, i) => {
        seekerTimers.push(setTimeout(() => {
          if (!playing) return;
          const p = pxOf(spot.x, spot.y);
          seekerEl.style.left = p.x + 'px';
          seekerEl.style.top = p.y + 'px';
          seekerTimers.push(setTimeout(() => {
            if (!playing) return;
            seekerEl.classList.add('checking');
            GameAudio.playClickTick();
            statusTextEl.textContent = `オニが ${spot.name}を さがしてるよ…`;
            seekerTimers.push(setTimeout(() => {
              seekerEl.classList.remove('checking');
              if (!playing) return;
              if (spot.id === hiddenSpotId) {
                loseGame(i + 1);
              } else if (i === plan.length - 1) {
                winGame();
              }
            }, SEEKER_LOOK_TIME));
          }, 200));
        }, elapsed));
        elapsed += SEEKER_CHECK_GAP;
      });
    }

    hideBtn.addEventListener('click', hideHere);

    function startGame() {
      resetGame();
      startOverlay.classList.add('hide');
      endOverlay.classList.add('hide');
      playing = true;
      GameAudio.playBGM();
    }

    function winGame() {
      if (!playing) return;
      playing = false;
      clearSeekerTimers();
      GameAudio.stopBGM();
      GameAudio.playClearFanfare();
      playerEl.classList.remove('hidden-away');
      endTitleEl.textContent = '🎉 みつからなかった！ 🎉';
      endTextEl.textContent = `オニは ${SEEKER_CHECK_COUNT}かしょ さがしたけど、みつけられなかったよ！`;
      endOverlay.classList.remove('hide');
      Leaderboard.showRankFlow({ gameId: 'hide-and-seek', score: SEEKER_CHECK_COUNT, higherIsBetter: true, unit: 'かい たえた', title: '🙈 かくれんぼ ランキング' });
    }

    function loseGame(foundAtCheck) {
      if (!playing) return;
      playing = false;
      clearSeekerTimers();
      GameAudio.stopBGM();
      GameAudio.playFailBuzz();
      playerEl.classList.remove('hidden-away');
      endTitleEl.textContent = '😆 みつかっちゃった！';
      endTextEl.textContent = `${foundAtCheck}かいめの サーチで みつかっちゃった！もう いちど ちょうせん しよう！`;
      endOverlay.classList.remove('hide');
      Leaderboard.showRankFlow({ gameId: 'hide-and-seek', score: Math.max(0, foundAtCheck - 1), higherIsBetter: true, unit: 'かい たえた', title: '🙈 かくれんぼ ランキング' });
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);

    renderSpots();
    const home = pxOf(PLAYER_HOME.x, PLAYER_HOME.y);
    playerX = home.x;
    playerY = home.y;
    playerEl.style.left = playerX + 'px';
    playerEl.style.top = playerY + 'px';
    const shome = pxOf(SEEKER_HOME.x, SEEKER_HOME.y);
    seekerEl.style.left = shome.x + 'px';
    seekerEl.style.top = shome.y + 'px';
    lastFrame = performance.now();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
