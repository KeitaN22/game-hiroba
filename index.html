<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ソウスケゲーム広場</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div class="hero">
    <h1>🎮 ソウスケゲーム広場 🎮</h1>
    <p class="subtitle-row">
      あそびたい ゲームを えらんでね！
      <span class="snack-badge">🍬 <span id="snackCount">0</span></span>
      <span class="money-badge">💰 <span id="moneyCount">0</span></span>
      <button class="atm-badge" id="atmBtn">🏧 ATM</button>
    </p>
  </div>

  <div class="grid" id="grid"></div>

  <script src="games.js?v=64"></script>
  <script>
    const grid = document.getElementById('grid');
    const snackCountEl = document.getElementById('snackCount');
    const moneyCountEl = document.getElementById('moneyCount');

    const SNACK_KEY = 'soutaSnackCount';
    function getSnackCount() {
      return parseInt(localStorage.getItem(SNACK_KEY) || '0', 10);
    }
    function bumpSnackCount() {
      const next = getSnackCount() + 1;
      localStorage.setItem(SNACK_KEY, String(next));
      return next;
    }
    snackCountEl.textContent = getSnackCount();

    const MONEY_KEY = 'soutaMoneyCount';
    function getMoneyCount() {
      return parseInt(localStorage.getItem(MONEY_KEY) || '0', 10);
    }
    function bumpMoneyCount(amount) {
      const next = getMoneyCount() + amount;
      localStorage.setItem(MONEY_KEY, String(next));
      return next;
    }
    moneyCountEl.textContent = getMoneyCount();

    const atmBtn = document.getElementById('atmBtn');
    atmBtn.addEventListener('click', () => {
      moneyCountEl.textContent = bumpMoneyCount(20);
      atmBtn.classList.remove('pop');
      void atmBtn.offsetWidth;
      atmBtn.classList.add('pop');
    });

    if (GAMES.length === 0) {
      grid.innerHTML = '<div class="empty-hint">まだ ゲームが ないよ。<br>あたらしい ゲームを つくってみよう！</div>';
    } else {
      GAMES.forEach((game, index) => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = game.path;
        a.style.background = game.color;
        a.innerHTML = `
          <div class="number-badge">${index + 1}</div>
          <div class="emoji">${game.emoji}</div>
          <div class="title">${game.title}</div>
          <div class="desc">${game.desc}</div>
          <div class="play-btn">あそぶ ▶</div>
        `;
        a.addEventListener('click', () => {
          bumpSnackCount();
          bumpMoneyCount(5);
        });
        grid.appendChild(a);
      });
    }
  </script>
</body>
</html>
