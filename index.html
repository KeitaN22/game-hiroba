<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ソウスケゲーム広場</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <div class="hero">
    <h1>🎮 ソウスケゲーム広場 🎮</h1>
    <p class="subtitle-row">
      あそびたい ゲームを えらんでね！
      <span class="snack-badge">🍬 <span id="snackCount">0</span></span>
      <span class="money-badge">💰 <span id="moneyCount">0</span></span>
      <button class="atm-badge" id="atmBtn">🏧 ATM</button>
    </p>
  </div>

  <div class="unlock-toast" id="unlockToast"></div>

  <div class="grid" id="grid"></div>

  <script src="games.js?v=75"></script>
  <script>
    const grid = document.getElementById('grid');
    const snackCountEl = document.getElementById('snackCount');
    const moneyCountEl = document.getElementById('moneyCount');

    const SNACK_KEY = 'soutaSnackCount';
    function getSnackCount() {
      return parseInt(localStorage.getItem(SNACK_KEY) || '0', 10);
    }
    function bumpSnackCount() {
      const next = getSnackCount() + 1;
      localStorage.setItem(SNACK_KEY, String(next));
      return next;
    }
    snackCountEl.textContent = getSnackCount();

    const MONEY_KEY = 'soutaMoneyCount';
    function getMoneyCount() {
      return parseInt(localStorage.getItem(MONEY_KEY) || '0', 10);
    }
    function bumpMoneyCount(amount) {
      const next = getMoneyCount() + amount;
      localStorage.setItem(MONEY_KEY, String(next));
      return next;
    }
    moneyCountEl.textContent = getMoneyCount();

    function isGameUnlocked(game) {
      return !game.unlockPrice || getMoneyCount() >= game.unlockPrice;
    }
    const lockedGames = GAMES.filter(g => g.unlockPrice);

    const unlockToastEl = document.getElementById('unlockToast');
    function showToast(text) {
      unlockToastEl.textContent = text;
      unlockToastEl.classList.remove('show');
      void unlockToastEl.offsetWidth;
      unlockToastEl.classList.add('show');
    }

    let unlockedIdSet = new Set(lockedGames.filter(isGameUnlocked).map(g => g.id));

    function handleMoneyChange(newAmount) {
      moneyCountEl.textContent = newAmount;
      const nowUnlocked = lockedGames.filter(isGameUnlocked);
      const newlyUnlocked = nowUnlocked.filter(g => !unlockedIdSet.has(g.id));
      if (newlyUnlocked.length > 0) {
        newlyUnlocked.forEach(g => {
          const num = GAMES.findIndex(x => x.id === g.id) + 1;
          showToast(`🎉 ${num}ばんが あそべるように なりました！`);
        });
        unlockedIdSet = new Set(nowUnlocked.map(g => g.id));
        renderGrid();
      }
    }

    const atmBtn = document.getElementById('atmBtn');
    atmBtn.addEventListener('click', () => {
      handleMoneyChange(bumpMoneyCount(20));
      atmBtn.classList.remove('pop');
      void atmBtn.offsetWidth;
      atmBtn.classList.add('pop');
    });

    function renderGrid() {
      grid.innerHTML = '';
      if (GAMES.length === 0) {
        grid.innerHTML = '<div class="empty-hint">まだ ゲームが ないよ。<br>あたらしい ゲームを つくってみよう！</div>';
        return;
      }
      GAMES.forEach((game, index) => {
        const locked = game.unlockPrice && !isGameUnlocked(game);
        const a = document.createElement('a');
        a.className = 'card' + (locked ? ' locked' : '');
        a.href = game.path;
        a.style.background = game.color;
        a.innerHTML = `
          <div class="number-badge">${index + 1}</div>
          <div class="emoji">${locked ? '🔒' : game.emoji}</div>
          <div class="title">${game.title}</div>
          <div class="desc">${locked ? `🔒 これは アンロックされていません（おかね ${game.unlockPrice}で あそべるよ）` : game.desc}</div>
          <div class="play-btn">${locked ? 'ロック中' : 'あそぶ ▶'}</div>
        `;
        a.addEventListener('click', (e) => {
          if (locked) {
            e.preventDefault();
            showToast('🔒 これは アンロックされていません');
            return;
          }
          bumpSnackCount();
          handleMoneyChange(bumpMoneyCount(5));
        });
        grid.appendChild(a);
      });
    }

    renderGrid();
  </script>
</body>
</html>
